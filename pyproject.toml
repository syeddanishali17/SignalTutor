[project]
name = "signal-tutor"
version = "0.1.0"
description = "Signal Tutor: an independent interactive tutor for sensor electronics and signal conditioning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.62.0",
    "plotly==7.1.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

