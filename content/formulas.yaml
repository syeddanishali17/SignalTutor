# Formula registry (spec section 11).
#
# lecture_form / canonical_form are LaTeX for display.
# lecture_check / canonical_check are machine-readable and verified by
# scripts/validate_content.py with the safe parser in tutor.engine.expr
# (never eval). dimension_check records the result for the form that is
# SHOWN (canonical if present, else lecture); validation fails if it lies.
#
# status: verified      = consistent in the notes AND passes dimension/algebra checks
#                         (slides not yet compared: see 'evidence')
#         needs_review  = the source form has a problem; shown with a flag
#         supplemental  = standard textbook relation, not from the lecture

formulas:
  # --- foundations ------------------------------------------------------------
  - id: ohms_law
    title: Ohm's law
    concept: ohms_law
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check]
    lecture_form: "I = \\frac{V}{R}"
    lecture_check: {expr: "V/R", symbols: {V: V, R: ohm}, result_unit: A}
    dimension_check: pass
    comes_from: "Definition of resistance, R = V/I, solved for I."
    assumptions: ["Ohmic (linear) resistor"]
    meaning:
      - {symbol: "I", meaning: "current through the resistor", unit: "A", when_it_goes_up: "result"}
      - {symbol: "V", meaning: "voltage across the resistor", unit: "V", when_it_goes_up: "I rises in proportion"}
      - {symbol: "R", meaning: "resistance", unit: "Ω", when_it_goes_up: "I falls (1/R)"}

  - id: voltage_divider
    title: Unloaded voltage divider
    concept: voltage_divider
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check, sympy]
    lecture_form: "V_\\text{out} = V_\\text{in}\\,\\frac{R_2}{R_1 + R_2}"
    lecture_check: {expr: "Vin*R2/(R1+R2)", symbols: {Vin: V, R1: ohm, R2: ohm}, result_unit: V}
    dimension_check: pass
    comes_from: "Series current I = Vin/(R1+R2), then Ohm's law across R2."
    assumptions: ["Nothing draws current from the output node (no load)"]
    meaning:
      - {symbol: "V_\\text{in}", meaning: "supply across the whole divider", unit: "V", when_it_goes_up: "V_out rises in proportion"}
      - {symbol: "R_1", meaning: "top resistor (supply to output)", unit: "Ω", when_it_goes_up: "V_out falls"}
      - {symbol: "R_2", meaning: "bottom resistor (output to ground)", unit: "Ω", when_it_goes_up: "V_out rises towards V_in"}

  - id: strain_definition
    title: Strain
    concept: strain
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check]
    lecture_form: "\\varepsilon = \\frac{\\Delta L}{L}"
    lecture_check: {expr: "dL/L", symbols: {dL: m, L: m}, result_unit: "1"}
    dimension_check: pass
    meaning:
      - {symbol: "\\varepsilon", meaning: "strain (relative elongation)", unit: "1 (µε = 10⁻⁶)"}

  - id: thermal_drift
    title: Resistor temperature drift (linear)
    concept: temperature_compensation
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check]
    lecture_form: "R(T) = R\\,(1 + \\alpha\\,\\Delta T)"
    lecture_check: {expr: "R*(1 + alpha*dT)", symbols: {R: ohm, alpha: "1/K", dT: K}, result_unit: ohm}
    dimension_check: pass
    assumptions: ["Small temperature change (linear coefficient)"]

  # --- L01: piezoresistive transducer and bridges --------------------------------
  - id: gauge_factor
    title: Gauge factor
    concept: gauge_factor
    module: C2
    status: verified
    source: "Lecture 1 notes, p. 2"
    evidence: [notes, dimension_check]
    lecture_form: "G = \\frac{\\Delta R}{R}\\,\\frac{1}{\\varepsilon}"
    lecture_check: {expr: "dR/R/eps", symbols: {dR: ohm, R: ohm, eps: "1"}, result_unit: "1"}
    dimension_check: pass
    comes_from: "Definition: relative resistance change per unit strain."
    meaning:
      - {symbol: "G", meaning: "gauge factor", unit: "1", when_it_goes_up: "bigger ΔR for the same strain"}
      - {symbol: "\\Delta R/R", meaning: "relative resistance change", unit: "1"}
      - {symbol: "\\varepsilon", meaning: "strain", unit: "1"}

  - id: bridge_full_output
    title: Full-bridge output
    concept: wheatstone_full
    module: C3
    status: verified
    source: "Lecture 1 notes, p. 2"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "V_\\text{out} = \\frac{\\Delta R}{R}\\,V_b"
    lecture_check: {expr: "dR/R*Vb", symbols: {dR: ohm, R: ohm, Vb: V}, result_unit: V}
    dimension_check: pass
    comes_from: "R1, R3 = R + ΔR and R2, R4 = R − ΔR: each midpoint moves by (ΔR/2R)·V_b in opposite directions."
    assumptions: ["Equal and opposite ΔR in the four arms", "Ideal voltmeter (no current drawn)"]
    meaning:
      - {symbol: "V_\\text{out}", meaning: "bridge output (magnitude; sign depends on which node is +)", unit: "V"}
      - {symbol: "\\Delta R/R", meaning: "relative change of each gauge", unit: "1", when_it_goes_up: "V_out rises exactly in proportion"}
      - {symbol: "V_b", meaning: "bridge supply (V_0 in the L02 notes)", unit: "V", when_it_goes_up: "V_out rises in proportion"}

  - id: bridge_full_strain
    title: Full-bridge output from strain
    concept: wheatstone_full
    module: C3
    status: verified
    source: "Lecture 1 notes, p. 2"
    evidence: [notes, dimension_check]
    lecture_form: "V_\\text{out} = G\\,\\varepsilon\\,V_b"
    lecture_check: {expr: "G*eps*Vb", symbols: {G: "1", eps: "1", Vb: V}, result_unit: V}
    dimension_check: pass
    comes_from: "Insert ΔR/R = G·ε into the full-bridge output."

  - id: h_eps_v
    title: Transfer function strain → voltage
    concept: wheatstone_full
    module: C2
    status: verified
    source: "Lecture 1 notes, p. 2"
    evidence: [notes, dimension_check]
    lecture_form: "H_{\\varepsilon\\text{-}V} = \\frac{V_\\text{out}}{\\varepsilon} = G\\,V_b"
    lecture_check: {expr: "G*Vb", symbols: {G: "1", Vb: V}, result_unit: V}
    dimension_check: pass
    assumptions: ["Full bridge, linear regime"]

  - id: bridge_balance
    title: Bridge balance condition
    concept: wheatstone_bridge
    module: C3
    status: supplemental
    source: standard (textbook); follows from the two dividers in Lecture 2 notes, p. 2
    evidence: [textbook, sympy]
    lecture_form: "\\frac{R_1}{R_4} = \\frac{R_2}{R_3}"
    lecture_check: {expr: "R1/R4", symbols: {R1: ohm, R4: ohm}, result_unit: "1"}
    dimension_check: pass
    comes_from: "Set V2 = V0·R4/(R1+R4) equal to V1 = V0·R3/(R2+R3)."

  # --- L02: quarter-bridge derivation -------------------------------------------------
  - id: bridge_quarter_I1
    title: Right-branch current
    concept: wheatstone_quarter
    module: C3
    status: verified
    source: "Lecture 2 notes, p. 2"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "I_1 = \\frac{V_0}{2R}"
    lecture_check: {expr: "V0/(2*R)", symbols: {V0: V, R: ohm}, result_unit: A}
    dimension_check: pass

  - id: bridge_quarter_I2
    title: Left-branch current
    concept: wheatstone_quarter
    module: C3
    status: verified
    source: "Lecture 2 notes, p. 2"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "I_2 = \\frac{V_0}{2R + \\Delta R}"
    lecture_check: {expr: "V0/(2*R + dR)", symbols: {V0: V, R: ohm, dR: ohm}, result_unit: A}
    dimension_check: pass

  - id: bridge_quarter_V2
    title: Left midpoint voltage
    concept: wheatstone_quarter
    module: C3
    status: verified
    source: "Lecture 2 notes, p. 2"
    evidence: [notes, dimension_check, sympy]
    known_issue: K9
    lecture_form: "V_2 = I_2 R = \\frac{V_0 R}{2R + \\Delta R} = \\frac{V_0}{2 + \\Delta R/R}"
    lecture_check: {expr: "V0/(2 + dR/R)", symbols: {V0: V, R: ohm, dR: ohm}, result_unit: V}
    dimension_check: pass
    assumptions: ["The gauge R + ΔR is the UPPER-left arm (R1). See K9."]

  - id: bridge_quarter_exact
    title: Quarter-bridge output (exact)
    concept: wheatstone_quarter
    module: C3
    status: verified
    source: "Lecture 2 notes, p. 2 (intermediate step)"
    evidence: [notes, dimension_check, sympy]
    known_issue: K9
    lecture_form: "V_2 - V_1 = V_0\\left(\\frac{1}{2 + \\Delta R/R} - \\frac12\\right)"
    lecture_check: {expr: "V0*(1/(2 + dR/R) - 1/2)", symbols: {V0: V, R: ohm, dR: ohm}, result_unit: V}
    dimension_check: pass

  - id: bridge_quarter_approx
    title: Quarter-bridge output (small change)
    concept: wheatstone_quarter
    module: C3
    status: verified
    source: "Lecture 2 notes, p. 2"
    evidence: [notes, dimension_check, sympy]
    known_issue: K9
    lecture_form: "V_2 - V_1 \\cong -\\frac14\\,\\frac{\\Delta R}{R}\\,V_0 \\quad\\text{for } \\frac{\\Delta R}{R} \\ll 1"
    lecture_check: {expr: "-dR/R*V0/4", symbols: {V0: V, R: ohm, dR: ohm}, result_unit: V}
    dimension_check: pass
    comes_from: "First-order expansion of the exact output in ΔR/R."
    assumptions: ["ΔR/R ≪ 1", "Ideal voltmeter (no current drawn)", "Gauge in the upper-left arm (sign, see K9)"]
    meaning:
      - {symbol: "V_2 - V_1", meaning: "bridge output (left midpoint minus right midpoint)", unit: "V"}
      - {symbol: "\\Delta R/R", meaning: "relative change of the one active gauge", unit: "1", when_it_goes_up: "|V_2 − V_1| grows (almost linearly)"}
      - {symbol: "V_0", meaning: "bridge supply (V_b in the L01 notes)", unit: "V", when_it_goes_up: "output grows in proportion"}
      - {symbol: "\\tfrac14", meaning: "only one of four arms is active, and it only moves one midpoint", unit: "1"}

  - id: quarter_approx_error
    title: Relative error of the quarter-bridge approximation
    concept: wheatstone_quarter
    module: C3
    status: supplemental
    source: derived in this app (SymPy-verified), not in the notes
    evidence: [sympy]
    lecture_form: "\\frac{V_\\text{approx} - V_\\text{exact}}{V_\\text{exact}} = \\frac12\\,\\frac{\\Delta R}{R}"
    lecture_check: {expr: "dR/R/2", symbols: {dR: ohm, R: ohm}, result_unit: "1"}
    dimension_check: pass

  - id: bridge_loading
    title: Reading with a finite meter resistance (equal-arm bridge)
    concept: bridge_loading
    module: C3
    status: supplemental
    source: standard (Thevenin equivalent); motivated by Lecture 2 notes, p. 4
    evidence: [textbook, dimension_check]
    lecture_form: "V_\\text{read} \\approx V_\\text{open}\\,\\frac{R_\\text{in}}{R_\\text{in} + R}"
    lecture_check: {expr: "Vopen*Rin/(Rin + R)", symbols: {Vopen: V, Rin: ohm, R: ohm}, result_unit: V}
    dimension_check: pass
    assumptions: ["All four arms ≈ R (each midpoint has source resistance R/2)"]

  # --- seeded needs_review forms (spec 11, K1–K6) ---------------------------------------
  - id: mic_current
    concept: capacitor_current
    title: Microphone current (DC bias)
    module: C5
    status: needs_review
    source: "Lecture 1 notes, p. 6"
    evidence: [notes, dimension_check]
    known_issue: K1
    lecture_form: "\\hat I(t) = V_b C_0 \\frac{1}{(d-x)^2}\\, i\\omega\\hat x(t)"
    canonical_form: "\\hat I(t) = V_b C_0 \\frac{d}{(d-x)^2}\\, i\\omega\\hat x(t)"
    issue: "Lecture form has wrong dimensions (A/m instead of A). dC/dx = C0·d/(d−x)²."
    lecture_check: {expr: "Vb*C0*1/(d - x)^2*imath*omega*x", symbols: {Vb: V, C0: F, d: m, x: m, omega: "1/s"}, result_unit: A}
    canonical_check: {expr: "Vb*C0*d/(d - x)^2*imath*omega*x", symbols: {Vb: V, C0: F, d: m, x: m, omega: "1/s"}, result_unit: A}
    dimension_check: pass
    shown_in_exam_mode: canonical_with_flag

  - id: dC_dx
    concept: capacitive_sensor
    title: Slope of the parallel-plate capacitance
    module: C4
    status: needs_review
    source: "Lecture 1 notes, p. 4"
    evidence: [notes, dimension_check]
    known_issue: K2
    lecture_form: "\\frac{\\partial C}{\\partial x} = \\frac{d}{(d-x)^2}"
    canonical_form: "\\frac{\\partial C}{\\partial x} = \\frac{\\varepsilon A}{(d-x)^2} = \\frac{C_0\\, d}{(d-x)^2}"
    issue: "Lecture form has units 1/m, but dC/dx must be in F/m. The prefactor εA = C0·d is missing."
    lecture_check: {expr: "d/(d - x)^2", symbols: {d: m, x: m}, result_unit: "F/m"}
    canonical_check: {expr: "eps*A/(d - x)^2", symbols: {eps: "F/m", A: "m^2", d: m, x: m}, result_unit: "F/m"}
    dimension_check: pass
    shown_in_exam_mode: canonical_with_flag

  - id: tia_output_barometer
    concept: capacitor_current
    title: Transimpedance output, barometer case
    module: C11
    status: needs_review
    source: "Lecture 1 notes, p. 5"
    evidence: [notes, dimension_check]
    known_issue: K3
    lecture_form: "V_\\text{out} = -R\\,V_0\\,\\omega\\,\\sin(\\omega t)\\,C_0\\ldots"
    canonical_form: "V_\\text{out} = +R\\,V_0\\,\\omega\\,C\\,\\sin(\\omega t)"
    issue: "Sign: V_out = −R·I and I = −V0·ω·C·sin(ωt), so V_out is positive. Amplitude unaffected."
    lecture_check: {expr: "-R*V0*omega*C0*sin(omega*t)", symbols: {R: ohm, V0: V, omega: "1/s", C0: F, t: s}, result_unit: V}
    canonical_check: {expr: "R*V0*omega*C*sin(omega*t)", symbols: {R: ohm, V0: V, omega: "1/s", C: F, t: s}, result_unit: V}
    dimension_check: pass
    shown_in_exam_mode: canonical_with_flag

  - id: noise_band_power
    concept: band_noise
    title: Noise power in a frequency band
    module: C13
    status: needs_review
    source: "Lecture 2 notes, p. 7"
    evidence: [notes, dimension_check]
    known_issue: K4
    lecture_form: "P = S_V(\\omega)\\cdot(\\omega_2 - \\omega_1)"
    canonical_form: "\\sigma^2 = \\int_{f_1}^{f_2} S(f)\\,df \\;\\overset{\\text{white}}{=}\\; S_0\\,(f_2 - f_1) = \\frac{S_0}{2\\pi}(\\omega_2-\\omega_1)"
    issue: "Valid only for white noise, and a per-Hz PSD integrated over ω needs a factor 1/2π. The dimension check passes (rad/s and Hz are both 1/s), so it cannot catch this."
    lecture_check: {expr: "S*(omega2 - omega1)", symbols: {S: "V^2/Hz", omega2: "1/s", omega1: "1/s"}, result_unit: "V^2"}
    canonical_check: {expr: "S*(f2 - f1)", symbols: {S: "V^2/Hz", f2: Hz, f1: Hz}, result_unit: "V^2"}
    dimension_check: pass
    shown_in_exam_mode: canonical_with_flag

  - id: variance_from_psd
    concept: band_noise
    title: Variance from the PSD
    module: C13
    status: needs_review
    source: "Lecture 2 notes, p. 8"
    evidence: [notes]
    known_issue: K5
    lecture_form: "\\sigma_x^2 = \\int_0^\\infty S_x(\\omega)\\,df"
    canonical_form: "\\sigma_x^2 = \\int_0^\\infty S_x(f)\\,df = \\frac{1}{2\\pi}\\int_0^\\infty S_x(\\omega)\\,d\\omega"
    issue: "Mixed variables: S written as a function of ω but integrated over f. State which variable the density is per."
    dimension_check: not_applicable
    shown_in_exam_mode: canonical_with_flag

  - id: strain_prefactor
    title: Membrane strain vs pressure
    module: C2
    status: needs_review
    source: "Lecture 1 notes, p. 2"
    evidence: [notes, dimension_check]
    known_issue: K6
    lecture_form: "\\varepsilon(p) \\cong \\frac{A}{E h^2}\\,p = \\xi\\, p"
    canonical_form: "\\varepsilon(p) \\approx k\\,\\frac{a^2}{E h^2}\\,p"
    issue: "Dimensionally fine, but the prefactor is geometry-dependent: plate theory uses the side length (or radius) squared a², with a dimensionless constant k, not the membrane area A."
    lecture_check: {expr: "A/(E*h^2)*p", symbols: {A: "m^2", E: Pa, h: m, p: Pa}, result_unit: "1"}
    canonical_check: {expr: "k*a^2/(E*h^2)*p", symbols: {k: "1", a: m, E: Pa, h: m, p: Pa}, result_unit: "1"}
    dimension_check: pass
    shown_in_exam_mode: canonical_with_flag

  # --- L02: op-amp and the three approaches ---------------------------------------------------
  - id: opamp_output
    title: Op-amp output (general)
    concept: op_amp
    module: C8
    status: verified
    source: "Lecture 2 notes, p. 1"
    evidence: [notes, dimension_check]
    lecture_form: "V_\\text{out} = A_d\\,(V_+ - V_-) + A_{cm}\\,V_{cm}"
    lecture_check: {expr: "Ad*(Vp - Vm) + Acm*Vcm", symbols: {Ad: "1", Vp: V, Vm: V, Acm: "1", Vcm: V}, result_unit: V}
    dimension_check: pass
    assumptions: ["Output not saturated (inside the rails)"]
    meaning:
      - {symbol: "A_d", meaning: "differential gain (ideal: ∞)", unit: "1"}
      - {symbol: "A_{cm}", meaning: "common-mode gain (ideal: 0)", unit: "1"}
      - {symbol: "V_+ - V_-", meaning: "input difference", unit: "V", when_it_goes_up: "output rises — until it hits a rail"}

  - id: closed_loop_gain
    title: Closed-loop gain with finite op-amp gain
    concept: negative_feedback
    module: C8
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check, sympy]
    lecture_form: "\\frac{V_\\text{out}}{V_\\text{in}} = \\frac{A_d}{1 + A_d\\,\\beta} \\xrightarrow{A_d\\to\\infty} \\frac{1}{\\beta},\\qquad \\beta = \\frac{R_2}{R_1 + R_2}"
    lecture_check: {expr: "Ad/(1 + Ad*R2/(R1 + R2))", symbols: {Ad: "1", R1: ohm, R2: ohm}, result_unit: "1"}
    dimension_check: pass

  - id: noninv_gain
    title: Non-inverting amplifier
    concept: non_inverting_amp
    module: C9
    status: verified
    source: "Lecture 2 notes, p. 3"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "V_\\text{out} = V_\\text{in}\\left(1 + \\frac{R_1}{R_2}\\right)"
    lecture_check: {expr: "Vin*(1 + R1/R2)", symbols: {Vin: V, R1: ohm, R2: ohm}, result_unit: V}
    dimension_check: pass
    comes_from: "Virtual short V− = Vin; the same current flows through R2 and R1 (no current into the input)."
    assumptions: ["Negative feedback", "Not saturated", "Ideal op-amp"]

  - id: diffamp_gain
    title: Difference amplifier
    concept: difference_amp
    module: C9
    status: verified
    source: "Lecture 2 notes, p. 3"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "V_\\text{out} = A_d\\,(V_2 - V_1),\\qquad A_d = \\frac{R_2}{R_1} = \\frac{R_4}{R_3}"
    lecture_check: {expr: "R2/R1*(V2 - V1)", symbols: {R1: ohm, R2: ohm, V1: V, V2: V}, result_unit: V}
    dimension_check: pass
    assumptions: ["Matched resistors R2/R1 = R4/R3", "Ideal op-amp"]

  - id: diffamp_cmr_condition
    title: Difference amplifier — condition for zero common-mode gain
    concept: difference_amp
    module: C9
    status: verified
    source: "Lecture 2 notes, p. 3"
    evidence: [notes, sympy]
    lecture_form: "\\frac{R_1}{R_2} = \\frac{R_3}{R_4} \\quad\\Rightarrow\\quad A_{cm} = 0"
    lecture_check: {expr: "R1/R2", symbols: {R1: ohm, R2: ohm}, result_unit: "1"}
    dimension_check: pass

  - id: diffamp_acm
    title: Difference amplifier — common-mode gain with mismatch
    concept: cmrr
    module: C9
    status: supplemental
    source: derived in this app (SymPy-verified), not in the notes
    evidence: [sympy, dimension_check]
    lecture_form: "A_{cm} = \\frac{R_4}{R_3 + R_4}\\left(1 + \\frac{R_2}{R_1}\\right) - \\frac{R_2}{R_1}"
    lecture_check: {expr: "R4/(R3 + R4)*(1 + R2/R1) - R2/R1", symbols: {R1: ohm, R2: ohm, R3: ohm, R4: ohm}, result_unit: "1"}
    dimension_check: pass

  - id: cmrr_def
    title: Common-mode rejection ratio
    concept: cmrr
    status: supplemental
    source: standard (datasheet definition)
    evidence: [textbook, dimension_check]
    lecture_form: "\\text{CMRR} = \\frac{A_d}{A_{cm}},\\qquad \\text{CMRR}_\\text{dB} = 20\\log_{10}\\frac{A_d}{A_{cm}}"
    lecture_check: {expr: "Ad/Acm", symbols: {Ad: "1", Acm: "1"}, result_unit: "1"}
    dimension_check: pass

  - id: ina_stage1
    title: Instrumentation amplifier — stage 1
    concept: instrumentation_amp
    module: C10
    status: verified
    source: "Lecture 2 notes, p. 4–5"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "A_d = 1 + \\frac{2R_2}{R_1},\\qquad A_{cm} = 1"
    lecture_check: {expr: "1 + 2*R2/R1", symbols: {R1: ohm, R2: ohm}, result_unit: "1"}
    dimension_check: pass
    comes_from: "Common mode: no current in R1 → outputs follow the inputs. Differential: the same current through R2, R1, R2 (KCL)."
    meaning:
      - {symbol: "R_1", meaning: "gain resistor between the inverting inputs", unit: "Ω", when_it_goes_up: "gain falls"}
      - {symbol: "R_2", meaning: "feedback resistor (one per op-amp)", unit: "Ω", when_it_goes_up: "gain rises"}
      - {symbol: "2", meaning: "both R2 carry the same current", unit: "1"}

  - id: ina_stage2
    title: Instrumentation amplifier — stage 2
    concept: instrumentation_amp
    module: C10
    status: verified
    source: "Lecture 2 notes, p. 4"
    evidence: [notes, sympy]
    lecture_form: "A_d = 1,\\qquad A_{cm} = 0 \\qquad (\\text{four equal resistors } R)"
    lecture_check: {expr: "R/R", symbols: {R: ohm}, result_unit: "1"}
    dimension_check: pass

  - id: ina_output
    title: Instrumentation amplifier — output
    concept: instrumentation_amp
    module: C10
    status: verified
    source: "Lecture 2 notes, p. 5"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "V_\\text{out} = V_{o2} - V_{o1} = \\left(1 + \\frac{2R_2}{R_1}\\right)(V_2 - V_1)"
    lecture_check: {expr: "(1 + 2*R2/R1)*(V2 - V1)", symbols: {R1: ohm, R2: ohm, V1: V, V2: V}, result_unit: V}
    dimension_check: pass
    known_issue: K10

  # --- L01: capacitive pressure sensor (M3) ----------------------------------------------------
  - id: pressure_force
    title: Pressure
    concept: force_pressure
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check]
    lecture_form: "p = \\frac{F}{A}"
    lecture_check: {expr: "F/A", symbols: {F: N, A: "m^2"}, result_unit: Pa}
    dimension_check: pass
    meaning:
      - {symbol: "p", meaning: "pressure", unit: "Pa", when_it_goes_up: "result"}
      - {symbol: "F", meaning: "force on the surface", unit: "N", when_it_goes_up: "p rises in proportion"}
      - {symbol: "A", meaning: "area the force is spread over", unit: "m²", when_it_goes_up: "p falls"}

  - id: membrane_hpx
    title: Membrane on two springs (pressure → displacement)
    concept: spring_hooke
    module: C4
    status: verified
    source: "Lecture 1 notes, p. 3"
    evidence: [notes, dimension_check]
    lecture_form: "F = 2k\\,x = p\\,A \\quad\\Rightarrow\\quad H_{p\\text{-}x} = \\frac{x}{p} = \\frac{A}{2k}"
    lecture_check: {expr: "A/(2*k)", symbols: {A: "m^2", k: "N/m"}, result_unit: "m/Pa"}
    dimension_check: pass
    comes_from: "Force balance: the two springs push back with 2k·x, the pressure pushes with p·A."
    assumptions: ["Membrane modelled as a rigid plate on two linear springs", "Static (slow) pressure"]
    meaning:
      - {symbol: "x", meaning: "membrane displacement toward the fixed plate", unit: "m", when_it_goes_up: "result"}
      - {symbol: "A", meaning: "membrane area", unit: "m²", when_it_goes_up: "more force from the same pressure → x rises"}
      - {symbol: "k", meaning: "stiffness of each spring", unit: "N/m", when_it_goes_up: "x falls"}

