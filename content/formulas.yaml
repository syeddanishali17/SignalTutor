    evidence: [notes, dimension_check, sympy]
    lecture_form: "\\frac{x}{\\left(1 - \\frac{x}{d}\\right)^2} \\approx 0 + x + 2\\,\\frac{x^2}{d} + 3\\,\\frac{x^3}{d^2} + \\dots"
    lecture_check: {expr: "x + 2*x^2/d + 3*x^3/d^2", symbols: {x: m, d: m}, result_unit: m}
    dimension_check: pass
    assumptions: ["Expansion around x = 0, |x/d| < 1"]

