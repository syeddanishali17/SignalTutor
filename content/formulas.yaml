    lecture_form: "\\frac{1}{1 - \\frac{x}{d}} \\cong 1 + \\frac{x}{d} + \\frac{x^2}{d^2} + \\frac{x^3}{d^3} + \\dots"
    lecture_check: {expr: "1 + x/d + (x/d)^2 + (x/d)^3", symbols: {x: m, d: m}, result_unit: "1"}
    dimension_check: pass
    assumptions: ["|x/d| < 1; truncation valid for x ≪ d"]

  - id: small_signal_output
