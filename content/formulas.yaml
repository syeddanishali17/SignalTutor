  - id: psd_convention
    title: PSD written in f or in ω
    concept: psd
    module: C13
    status: needs_review
    source: "Lecture 2 notes, p. 8"
    evidence: [notes]
    known_issue: K8
    lecture_form: "S_x(f) = S_x(\\omega) = S_x(2\\pi f),\\quad \\text{both in } [\\text{m}^2/\\text{Hz}]"
    canonical_form: "S_x \\text{ is one per-hertz density};\\ S_x(\\omega) \\text{ means } S_x \\text{ evaluated at } f = \\omega/2\\pi"
    issue: "Reads like two different densities being equal. It is one density per hertz, written as a function of f or of ω; integrating over ω then needs 1/2π."
    dimension_check: not_applicable
    shown_in_exam_mode: canonical_with_flag

  - id: pink_band_power
    title: Band power of 1/f noise
    concept: band_noise
    module: C13
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check, sympy]
    lecture_form: "S(f) = \\frac{S_1}{f}:\\qquad \\sigma^2 = \\int_{f_1}^{f_2}\\frac{S_1}{f}\\,df = S_1\\,\\ln\\frac{f_2}{f_1}"
    lecture_check: {expr: "S1*log(f2/f1)", symbols: {S1: "V^2", f2: Hz, f1: Hz}, result_unit: "V^2"}
    dimension_check: pass
    meaning:
      - {symbol: "S_1", meaning: "1/f noise level: S(f)·f", unit: "V²"}

  - id: band_rms
    title: RMS noise in a band
    concept: band_noise
    module: C13
    status: supplemental
    source: standard (textbook)
    evidence: [textbook, dimension_check]
    lecture_form: "V_\\text{rms} = \\sqrt{\\int_{f_1}^{f_2} S(f)\\,df}\\;\\overset{\\text{white}}{=}\\;\\sqrt{S_0\\,(f_2 - f_1)}"
    lecture_check: {expr: "sqrt(S0*(f2 - f1))", symbols: {S0: "V^2/Hz", f2: Hz, f1: Hz}, result_unit: V}
    dimension_check: pass

  - id: psd_two_sided
    title: One-sided and two-sided PSD
    concept: psd_sides
    module: C13
    status: verified
    source: "Lecture 2 notes, p. 8"
    evidence: [notes, sympy]
    lecture_form: "\\sigma_x^2 = \\int_0^\\infty S_x(f)\\,df = \\int_{-\\infty}^{\\infty} S''_x(f)\\,df,\\qquad S''(\\omega) = \\tfrac12\\,S(\\omega)"
    lecture_check: {expr: "2*(S/2)*f", symbols: {S: "V^2/Hz", f: Hz}, result_unit: "V^2"}
    dimension_check: pass
    assumptions: ["S one-sided (f ≥ 0), S'' two-sided and even in f"]
