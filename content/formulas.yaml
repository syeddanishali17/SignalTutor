    lecture_form: "Q = V\\cdot C"
    lecture_check: {expr: "V*C", symbols: {V: V, C: F}, result_unit: C}
    dimension_check: pass
    meaning:
      - {symbol: "Q", meaning: "charge stored (+Q on one plate, −Q on the other)", unit: "C (coulomb)", when_it_goes_up: "result"}
      - {symbol: "V", meaning: "voltage across the plates", unit: "V", when_it_goes_up: "Q rises in proportion"}
      - {symbol: "C", meaning: "capacitance", unit: "F", when_it_goes_up: "Q rises in proportion"}

  - id: parallel_plate
    title: Parallel-plate capacitance with deflection x
    concept: capacitive_sensor
    module: C4
    status: verified
    source: "Lecture 1 notes, p. 4"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "C(x) = \\frac{A\\,\\varepsilon}{d - x} = \\frac{\\varepsilon A}{d}\\,\\frac{1}{1 - \\frac{x}{d}} = \\frac{C_0}{1 - \\frac{x}{d}}"
    lecture_check: {expr: "eps*A/(d - x)", symbols: {eps: "F/m", A: "m^2", d: m, x: m}, result_unit: F}
    dimension_check: pass
    assumptions: ["Plates parallel and much wider than the gap (fringe fields neglected)"]
    meaning:
      - {symbol: "C(x)", meaning: "capacitance at deflection x", unit: "F", when_it_goes_up: "result"}
      - {symbol: "\\varepsilon", meaning: "permittivity of the gap (ε₀ = 8.85·10⁻¹² F/m for air)", unit: "F/m", when_it_goes_up: "C rises"}
      - {symbol: "A", meaning: "plate area", unit: "m²", when_it_goes_up: "C rises"}
      - {symbol: "d", meaning: "gap at rest", unit: "m", when_it_goes_up: "C falls"}
      - {symbol: "x", meaning: "deflection (the gap is d − x)", unit: "m", when_it_goes_up: "C rises, faster and faster"}
      - {symbol: "C_0", meaning: "capacitance at rest, εA/d", unit: "F"}

  - id: capacitor_current
    title: Capacitor current (product rule)
    concept: capacitor_current
    module: C5
    status: verified
    source: "Lecture 1 notes, p. 4"
    evidence: [notes, dimension_check]
    lecture_form: "I(t) = \\frac{dQ}{dt} = \\frac{d}{dt}\\big[V(t)\\,C(t)\\big] = C(t)\\,\\frac{dV}{dt} + V(t)\\,\\frac{dC}{dt}"
    lecture_check: {expr: "C*dVdt + V*dCdt", symbols: {C: F, dVdt: "V/s", V: V, dCdt: "F/s"}, result_unit: A}
    dimension_check: pass
    comes_from: "Q = V·C differentiated with the product rule."
    meaning:
      - {symbol: "C\\,dV/dt", meaning: "current because the voltage changes (barometer, AC bias)", unit: "A"}
      - {symbol: "V\\,dC/dt", meaning: "current because the capacitor changes (microphone, moving membrane)", unit: "A"}

  - id: barometer_current
    title: Barometer case (AC bias)
    concept: capacitor_current
    module: C5
    status: verified
    source: "Lecture 1 notes, p. 4–5"
    evidence: [notes, dimension_check, sympy]
    lecture_form: "\\hat V_b = V_0 e^{i\\omega t},\\quad \\hat I = V_0\\,i\\omega C\\,e^{i\\omega t},\\quad I(t) = \\text{Re}[\\hat I] = -V_0\\,\\omega\\,C\\sin\\omega t"
    lecture_check: {expr: "-V0*omega*C*sin(omega*t)", symbols: {V0: V, omega: "1/s", C: F, t: s}, result_unit: A}
    dimension_check: pass
    assumptions: ["Quasi-static pressure: dC/dt ≈ 0 during a period of the bias"]
    meaning:
      - {symbol: "V_0", meaning: "amplitude of the AC bias", unit: "V", when_it_goes_up: "current rises in proportion"}
      - {symbol: "\\omega", meaning: "angular frequency of the bias, 2πf", unit: "rad/s", when_it_goes_up: "current rises in proportion"}
      - {symbol: "C", meaning: "quasi-static capacitance — carries the pressure", unit: "F", when_it_goes_up: "current rises in proportion"}

  - id: mic_current_chain
    title: Microphone case (DC bias, chain rule)
    concept: capacitor_current
    module: C5
    status: verified
    source: "Lecture 1 notes, p. 6"
    evidence: [notes, dimension_check]
    lecture_form: "I(t) \\cong V_b\\,\\frac{dC}{dt} = V_b\\,\\frac{dC}{dx}\\,\\frac{dx}{dt}"
    lecture_check: {expr: "Vb*dCdx*dxdt", symbols: {Vb: V, dCdx: "F/m", dxdt: "m/s"}, result_unit: A}
    dimension_check: pass
    assumptions: ["Constant (DC) bias: dV/dt = 0"]
    meaning:
      - {symbol: "V_b", meaning: "DC bias voltage", unit: "V", when_it_goes_up: "current rises in proportion"}
      - {symbol: "dC/dx", meaning: "slope of C(x) at the operating point", unit: "F/m", when_it_goes_up: "current rises"}
      - {symbol: "dx/dt", meaning: "membrane velocity (sound)", unit: "m/s", when_it_goes_up: "current rises"}

  - id: small_signal_series
