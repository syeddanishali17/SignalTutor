    lecture_check: {expr: "k*x", symbols: {k: "N/m", x: m}, result_unit: N}
    dimension_check: pass

  - id: charge_qcv
    title: Charge on a capacitor
    concept: capacitance
    module: C5
    status: verified
    source: "Lecture 1 notes, p. 4"
