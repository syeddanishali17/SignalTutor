    evidence: [textbook, dimension_check, sympy]
    lecture_form: "V_\\text{PI} = \\sqrt{\\frac{8\\,k_\\text{eff}\\,d^3}{27\\,\\varepsilon A}},\\qquad k_\\text{eff} = 2k"
    lecture_check: {expr: "sqrt(8*k*d^3/(27*eps*A))", symbols: {k: "N/m", d: m, eps: "F/m", A: "m^2"}, result_unit: V}
