    lecture_check: {expr: "Vft*(1 + x/d)", symbols: {Vft: V, x: m, d: m}, result_unit: V}
    dimension_check: pass
    assumptions: ["x ≪ d: second- and higher-order terms dropped"]
    meaning:
      - {symbol: "V_{ft}", meaning: "feed-through output at x = 0 (present without any pressure)", unit: "V"}
      - {symbol: "x/d", meaning: "relative deflection — the useful signal", unit: "1"}

  - id: mic_taylor
