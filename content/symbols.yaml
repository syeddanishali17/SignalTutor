# Symbol dictionary: every mathematical symbol or expression a learner can click.
# meaning: plain words first, then the precise statement. Markdown + $LaTeX$.

symbols:
  # --- voltage / potential ---------------------------------------------------------
  - id: phiA
    latex: "\\varphi_A"
    label: "φ_A"
    meaning: "**Potential of node A** — how high node A sits on the 'electrical height' scale. On its own it only means something relative to a chosen reference."
    unit: V
    concept: voltage
  - id: phiB
    latex: "\\varphi_B"
    label: "φ_B"
    meaning: "**Potential of node B** — the 'electrical height' of node B, measured from the same reference."
    unit: V
    concept: voltage
  - id: VAB
    latex: "V_{AB}"
    label: "V_AB"
    meaning: "**Voltage from B to A**: the difference $V_{AB} = \\varphi_A - \\varphi_B$. This is what a voltmeter with its red lead on A and black lead on B shows."
    unit: V
    concept: voltage

  # --- Ohm's law --------------------------------------------------------------------
  - id: ohm_V
    latex: "V"
    label: "V"
    meaning: "**Voltage across the resistor** — the 'push' that drives charge through it. Here it equals the battery voltage."
    unit: V
    concept: voltage
  - id: ohm_R
    latex: "R"
    label: "R"
    meaning: "**Resistance** — how strongly the resistor opposes current. It sits in the **denominator** (bottom) of $I = V/R$. A bigger bottom number makes the result smaller."
    unit: "Ω"
    concept: resistance
  - id: ohm_I
    latex: "I"
    label: "I"
    meaning: "**Current** — how much charge flows past a point each second. In a single loop it is the same everywhere."
    unit: A
    concept: charge_current

  # --- divider ------------------------------------------------------------------------
  - id: div_Vin
    latex: "V_\\text{in}"
    label: "V_in"
    meaning: "**Supply voltage** across the whole divider (both resistors together)."
    unit: V
    concept: voltage
  - id: div_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Top resistor**, between the supply and the output node."
    unit: "Ω"
    concept: resistance
  - id: div_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Bottom resistor**, between the output node and ground. The output voltage is the voltage across this resistor — that is why $R_2$ is on top of the fraction."
    unit: "Ω"
    concept: voltage_divider
  - id: div_total
    latex: "R_1 + R_2"
    label: "R₁ + R₂"
    meaning: "**Total resistance of the path.** The current has to pass through both resistors one after the other, so their resistances add. It is the denominator: the whole."
    unit: "Ω"
    concept: series_circuit
  - id: div_Vout
    latex: "V_\\text{out}"
    label: "V_out"
    meaning: "**Output voltage**: the potential of the middle node measured from ground — the share of the supply that drops across $R_2$."
    unit: V
    concept: voltage_divider

  # --- ground -----------------------------------------------------------------------
  - id: phi_ref
    latex: "\\varphi_\\text{ref}^\\text{old}"
    label: "φ_ref"
    meaning: "**Old potential of the node that becomes the new ground.** Subtracting it from every node makes that node read 0 V."
    unit: V
    concept: ground_reference

  # --- KCL ------------------------------------------------------------------------------
  - id: kcl_Iin
    latex: "I_\\text{in}"
    label: "I_in"
    meaning: "**Current flowing into the node.**"
    unit: A
    concept: kcl
  - id: kcl_I1
    latex: "I_1"
    label: "I₁"
    meaning: "**Current leaving through branch 1.**"
    unit: A
    concept: kcl
  - id: kcl_I2
    latex: "I_2"
    label: "I₂"
    meaning: "**Current leaving through branch 2** — whatever is left over. If it comes out negative, it actually flows *into* the node."
    unit: A
    concept: kcl

  # --- strain gauge / sensor --------------------------------------------------------------
  - id: sens_p
    latex: "p"
    label: "p"
    meaning: "**Pressure** on the membrane: force per area, $p = F/A$."
    unit: Pa
    concept: strain
  - id: sens_xi
    latex: "\\xi"
    label: "ξ"
    meaning: "**Membrane factor** (Greek 'xi'): how much strain one pascal of pressure produces. It depends on the membrane's size, thickness and stiffness: $\\varepsilon = \\xi\\,p$."
    unit: "1/Pa"
    concept: strain
  - id: sens_eps
    latex: "\\varepsilon"
    label: "ε"
    meaning: "**Strain** (Greek 'epsilon'): how much the surface stretches, as a fraction of its length. $+$ = stretched, $-$ = compressed. Tiny numbers, so we write µε = $10^{-6}$."
    unit: "1"
    concept: strain
  - id: sens_G
    latex: "G"
    label: "G"
    meaning: "**Gauge factor**: how strongly the gauge's resistance reacts to strain, $\\Delta R/R = G\\,\\varepsilon$. About 2 for metal foil, of order 100 for silicon."
    unit: "1"
    concept: gauge_factor

  # --- Wheatstone bridge --------------------------------------------------------------------
  - id: br_V0
    latex: "V_0"
    label: "V₀"
    meaning: "**Bridge supply voltage** that feeds both dividers (also called $V_b$)."
    unit: V
    concept: wheatstone_bridge
  - id: br_R
    latex: "R"
    label: "R"
    meaning: "**Nominal resistance**: the value every arm has when nothing is strained (e.g. 350 Ω)."
    unit: "Ω"
    concept: resistance
  - id: br_dR
    latex: "\\Delta R"
    label: "ΔR"
    meaning: "**Change in resistance** caused by strain. Δ (Greek capital 'delta') means 'change in'. Usually tiny: a fraction of an ohm on a 350 Ω gauge."
    unit: "Ω"
    concept: gauge_factor
  - id: br_Rplus
    latex: "R + \\Delta R"
    label: "R + ΔR"
    meaning: "**Resistance increased** from its nominal value — a gauge that is being **stretched**. Drawn with an arrow pointing up-right ↗."
    unit: "Ω"
    concept: gauge_factor
  - id: br_Rminus
    latex: "R - \\Delta R"
    label: "R − ΔR"
    meaning: "**Resistance decreased** from its nominal value — a gauge that is being **compressed**. Drawn with an arrow pointing down-left ↙."
    unit: "Ω"
    concept: gauge_factor
  - id: br_x
    latex: "\\frac{\\Delta R}{R}"
    label: "ΔR/R"
    meaning: "**Relative change**: the change as a fraction of the original value. $\\Delta R/R = 0.001$ means 0.1 %. It has no unit."
    unit: "1"
    concept: ratios
  - id: br_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Arm $R_1$** (top left). The name of the component — its value is written next to it, e.g. $R + \\Delta R$."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Arm $R_2$** (top right)."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R3
    latex: "R_3"
    label: "R₃"
    meaning: "**Arm $R_3$** (bottom right). $V_1$ is the voltage across it."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R4
    latex: "R_4"
    label: "R₄"
    meaning: "**Arm $R_4$** (bottom left). $V_2$ is the voltage across it."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_left
    latex: "R_1 + R_4"
    label: "R₁ + R₄"
    meaning: "**Total resistance of the left branch.** Its current $I_2$ passes through $R_1$ and then $R_4$, so they add. In the quarter bridge this is $2R + \\Delta R$."
    unit: "Ω"
    concept: series_circuit
  - id: br_right
    latex: "R_2 + R_3"
    label: "R₂ + R₃"
    meaning: "**Total resistance of the right branch**, carrying $I_1$. In the quarter bridge this is $2R$."
    unit: "Ω"
    concept: series_circuit
  - id: br_V1
    latex: "V_1"
    label: "V₁"
    meaning: "**Right midpoint voltage**, measured from ground (across $R_3$)."
    unit: V
    concept: voltage_divider
  - id: br_V2
    latex: "V_2"
    label: "V₂"
    meaning: "**Left midpoint voltage**, measured from ground (across $R_4$)."
    unit: V
    concept: voltage_divider
  - id: br_Vout
    latex: "V_2 - V_1"
    label: "V₂ − V₁"
    meaning: "**Bridge output**: the difference between the two midpoints — exactly what the meter between them reads. 0 V when balanced."
    unit: V
    concept: differential_signal
  - id: br_I1
    latex: "I_1"
    label: "I₁"
    meaning: "**Current in the right branch** ($R_2$ then $R_3$)."
    unit: A
    concept: charge_current
  - id: br_I2
    latex: "I_2"
    label: "I₂"
    meaning: "**Current in the left branch** ($R_1$ then $R_4$)."
    unit: A
    concept: charge_current

  # --- interference / signals -----------------------------------------------------------
  - id: sig_V1
    latex: "V_1"
    label: "V₁"
    meaning: "**Voltage of wire 1** (measured from ground): common level − half the signal + pickup."
    unit: V
    concept: differential_signal
  - id: sig_V2
    latex: "V_2"
    label: "V₂"
    meaning: "**Voltage of wire 2** (measured from ground): common level + half the signal + pickup."
    unit: V
    concept: differential_signal
  - id: sig_Vd
    latex: "V_d"
    label: "V_d"
    meaning: "**Differential signal** $V_d = V_2 - V_1$. The part that pushes the two wires apart — the measurement."
    unit: V
    concept: differential_signal
  - id: sig_Vcm
    latex: "V_{cm}"
    label: "V_cm"
    meaning: "**Common mode**: what both wires share, $V_{cm} = (V_1 + V_2)/2$. Here the bridge's DC level plus the mains pickup."
    unit: V
    concept: common_mode
  - id: sig_pickup
    latex: "v_\\text{pickup}"
    label: "v_pickup"
    meaning: "**Mains pickup**: a 50 Hz sine picked up from a nearby mains cable. It arrives on both wires almost equally."
    unit: V
    concept: interference

  # --- op-amp -------------------------------------------------------------------------------
  - id: op_Vp
    latex: "V_+"
    label: "V₊"
    meaning: "**Non-inverting input** (marked $+$): raising it pushes the output **up**."
    unit: V
    concept: op_amp
  - id: op_Vm
    latex: "V_-"
    label: "V₋"
    meaning: "**Inverting input** (marked $-$): raising it pushes the output **down**."
    unit: V
    concept: op_amp
  - id: op_Vdiff
    latex: "V_+ - V_-"
    label: "V₊ − V₋"
    meaning: "**The input difference** — the only thing an ideal op-amp responds to. Under negative feedback it becomes tiny (the virtual short)."
    unit: V
    concept: op_amp
  - id: op_Ad
    latex: "A_d"
    label: "A_d"
    meaning: "**Differential (open-loop) gain** of the op-amp itself: enormous, $10^5$ to $10^6$. Ideal: infinite."
    unit: "1"
    concept: op_amp
  - id: op_Vout
    latex: "V_\\text{out}"
    label: "V_out"
    meaning: "**Output voltage**, measured from ground. It can never leave the supply rails."
    unit: V
    concept: op_amp
  - id: op_rail
    latex: "\\pm V_s"
    label: "±V_s"
    meaning: "**Supply rails**: the op-amp's power supply, e.g. $\\pm 15\\,\\text{V}$. The output saturates (clips) there."
    unit: V
    concept: amplifier_gain

  # --- non-inverting amplifier ----------------------------------------------------------------
  - id: ni_Vin
    latex: "V_\\text{in}"
    label: "V_in"
    meaning: "**Input voltage**, applied to the $+$ input."
    unit: V
    concept: non_inverting_amp
  - id: ni_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Feedback resistor** from the output to $V_-$ (the names used here)."
    unit: "Ω"
    concept: non_inverting_amp
  - id: ni_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Resistor from $V_-$ to ground.** With $R_1$ it forms the divider that feeds part of the output back."
    unit: "Ω"
    concept: non_inverting_amp
  - id: ni_gain
    latex: "1 + \\frac{R_1}{R_2}"
    label: "1 + R₁/R₂"
    meaning: "**Closed-loop gain** of the non-inverting amplifier — set by two resistors, not by the op-amp. Even with $R_1 = 0$ it is 1 (a follower)."
    unit: "1"
    concept: non_inverting_amp

  # --- difference amplifier --------------------------------------------------------------------
  - id: da_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Input resistor** from $V_1$ to the $-$ input."
    unit: "Ω"
    concept: difference_amp
  - id: da_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Feedback resistor** from the output to the $-$ input."
    unit: "Ω"
    concept: difference_amp
  - id: da_R3
    latex: "R_3"
    label: "R₃"
    meaning: "**Input resistor** from $V_2$ to the $+$ input."
    unit: "Ω"
    concept: difference_amp
  - id: da_R4
    latex: "R_4"
    label: "R₄"
    meaning: "**Resistor from the $+$ input to ground.** Must match: $R_4/R_3 = R_2/R_1$."
    unit: "Ω"
    concept: difference_amp
  - id: da_gain
    latex: "\\frac{R_2}{R_1}"
    label: "R₂/R₁"
    meaning: "**Differential gain** when the resistors are matched ($R_2/R_1 = R_4/R_3$)."
    unit: "1"
    concept: difference_amp

  # --- instrumentation amplifier ---------------------------------------------------------------
  - id: ina_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**The gain resistor** between the two inverting inputs (nodes $A$ and $B$). Changing only $R_1$ changes the gain."
    unit: "Ω"
    concept: instrumentation_amp
  - id: ina_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Feedback resistors** of the two stage-1 op-amps (one each). The same current flows through both."
    unit: "Ω"
    concept: instrumentation_amp
  - id: ina_gain
    latex: "1 + \\frac{2R_2}{R_1}"
    label: "1 + 2R₂/R₁"
    meaning: "**Stage-1 differential gain** $A_d$. The 2 is there because the current flows through **both** $R_2$ resistors."
    unit: "1"
    concept: instrumentation_amp
  - id: ina_VA
    latex: "V_A"
    label: "V_A"
    meaning: "**Node A**, top end of $R_1$, held equal to the top input by the virtual short."
    unit: V
    concept: virtual_short
  - id: ina_VB
    latex: "V_B"
    label: "V_B"
    meaning: "**Node B**, bottom end of $R_1$, held equal to the bottom input by the virtual short."
    unit: V
    concept: virtual_short
  - id: ina_Vo1
    latex: "V_{o1}"
    label: "V_o1"
    meaning: "**Stage-1 output, top.** (One written form gives $V_1$ here — K10.)"
    unit: V
    concept: instrumentation_amp
  - id: ina_Vo2
    latex: "V_{o2}"
    label: "V_o2"
    meaning: "**Stage-1 output, bottom.** (One written form gives $V_2$ here — K10.)"
    unit: V
    concept: instrumentation_amp
  - id: ina_I
    latex: "I"
    label: "I"
    meaning: "**The one current** through $R_2$, $R_1$ and $R_2$: $I = (V_B - V_A)/R_1$. It cannot leave into the op-amp inputs (KCL)."
    unit: A
    concept: kcl
  - id: ina_Vout
    latex: "V_\\text{out}"
    label: "V_out"
    meaning: "**Final output** of stage 2: $V_\\text{out} = V_{o2} - V_{o1}$."
    unit: V
    concept: instrumentation_amp
  - id: da_Acm
    latex: "A_{cm}"
    label: "A_cm"
    meaning: >-
      **Common-mode gain**: how much of the voltage both inputs share reaches the output, $V_\text{out} = A_{cm}\,V_{cm}$.
      Ideally 0; for the difference amplifier $A_{cm} = \dfrac{R_4}{R_3 + R_4}\left(1 + \dfrac{R_2}{R_1}\right) - \dfrac{R_2}{R_1}$,
      which is 0 only when $R_4/R_3 = R_2/R_1$.
    concept: cmrr

  # --- capacitive sensor (M3) ---------------------------------------------------------------
  - id: cap_p
    latex: "p"
    label: "p"
    meaning: "**Pressure** on the membrane: force per area, $p = F/A$."
    unit: Pa
    concept: force_pressure
  - id: cap_A
    latex: "A"
    label: "A"
    meaning: "**Area** of the membrane and of the plates. More area collects more force from the same pressure, and holds more charge."
    unit: "m²"
    concept: capacitance
  - id: cap_k
    latex: "k"
    label: "k"
    meaning: "**Stiffness of each spring**: newtons of push-back per metre of squeeze. The membrane here sits on two of them, $2k$ in total."
    unit: "N/m"
    concept: spring_hooke
  - id: cap_x
    latex: "x"
    label: "x"
    meaning: "**Deflection**: how far the membrane has moved toward the fixed plate, measured from rest."
    unit: m
    concept: capacitive_sensor
  - id: cap_d
    latex: "d"
    label: "d"
    meaning: "**Gap at rest** between the two plates (no pressure)."
    unit: m
    concept: capacitive_sensor
  - id: cap_gap
    latex: "d - x"
    label: "d − x"
    meaning: "**Remaining gap** after the membrane moved by $x$. It is what sets the capacitance."
    unit: m
    concept: capacitive_sensor
  - id: cap_eps
    latex: "\\varepsilon"
    label: "ε"
    meaning: "**Permittivity** of the gap: how strongly the material between the plates helps store charge. Air: $\\varepsilon \\approx \\varepsilon_0 = 8.85\\times10^{-12}\\,\\text{F/m}$."
    unit: "F/m"
    concept: capacitance
  - id: cap_C
    latex: "C"
    label: "C"
    meaning: "**Capacitance**: charge stored per volt, $C = Q/V$. Sensor values are picofarads."
    unit: F
    concept: capacitance
  - id: cap_C0
    latex: "C_0"
    label: "C₀"
    meaning: "**Capacitance at rest**, $C_0 = \\varepsilon A/d$ (no deflection)."
    unit: F
    concept: capacitive_sensor
  - id: cap_Q
    latex: "Q"
    label: "Q"
    meaning: "**Charge** on the plates: $+Q$ on one, $-Q$ on the other."
    unit: "C (coulomb)"
    concept: capacitance
  - id: cap_V
    latex: "V"
    label: "V"
    meaning: "**Bias voltage** across the capacitor, supplied by the readout circuit."
    unit: V
    concept: capacitance
  - id: cap_I
    latex: "I"
    label: "I"
    meaning: "**Current** in the wires: charge flowing onto one plate and off the other, $I = dQ/dt$."
    unit: A
    concept: capacitor_current
  - id: cap_dVdt
    latex: "\\frac{dV}{dt}"
    label: "dV/dt"
    meaning: "**How fast the bias voltage changes** (volts per second). Zero for a DC bias; large for a fast AC bias."
    unit: "V/s"
    concept: derivative_rate
  - id: cap_dCdt
    latex: "\\frac{dC}{dt}"
    label: "dC/dt"
    meaning: "**How fast the capacitance changes** — only while the membrane moves. Nearly zero for a barometer, large for a microphone."
    unit: "F/s"
    concept: derivative_rate
  - id: cap_dCdx
    latex: "\\frac{dC}{dx}"
    label: "dC/dx"
    meaning: "**Slope of $C(x)$**: how much the capacitance changes per metre of deflection, $\\varepsilon A/(d-x)^2$. It grows as the gap closes."
    unit: "F/m"
    concept: chain_rule
  - id: cap_dxdt
    latex: "\\frac{dx}{dt}"
    label: "dx/dt"
    meaning: "**Speed of the membrane**. Sound shakes it quickly; a weather change moves it slowly."
    unit: "m/s"
    concept: chain_rule
  - id: cap_CdV
    latex: "C\\,\\frac{dV}{dt}"
    label: "C·dV/dt"
    meaning: "**Current because the voltage changes** (with the capacitor fixed). The barometer's term."
    unit: A
    concept: product_rule
  - id: cap_VdC
    latex: "V\\,\\frac{dC}{dt}"
    label: "V·dC/dt"
    meaning: "**Current because the capacitor changes** (with the voltage fixed). The microphone's term."
    unit: A
    concept: product_rule
  - id: cap_u
    latex: "\\frac{x}{d}"
    label: "x/d"
    meaning: "**Relative deflection**: the fraction of the gap the membrane has closed. Small-signal means $x/d \\ll 1$."
    unit: "1"
    concept: small_signal
  - id: cap_Fs
    latex: "F_\\text{spring}"
    label: "F_spring"
    meaning: "**Spring force** pushing the membrane back up, $2k\\,x$: grows in a straight line with $x$."
    unit: N
    concept: spring_hooke
  - id: cap_Fe
    latex: "F_\\text{el}"
    label: "F_el"
    meaning: "**Electrostatic pull** of the charged plates, $\\varepsilon A V^2/(2(d-x)^2)$: grows ever faster as the gap closes."
    unit: N
    concept: pull_in
  - id: cap_V0
    latex: "V_0"
    label: "V₀"
    meaning: "**Amplitude of the AC bias** $V_0\\cos\\omega t$ (barometer readout)."
    unit: V
    concept: capacitor_current
  - id: cap_Vb
    latex: "V_b"
    label: "V_b"
    meaning: "**DC bias voltage** (microphone readout). Also the voltage that pulls the plates together."
    unit: V
    concept: capacitor_current
  - id: cap_omega
    latex: "\\omega"
    label: "ω"
    meaning: "**Angular frequency**, $\\omega = 2\\pi f$. How fast the oscillation turns, in radians per second."
    unit: "rad/s"
    concept: phasor
  - id: cap_Hpx
    latex: "H_{p\\text{-}x}"
    label: "H_p-x"
    meaning: "**Transfer function pressure → deflection**: metres of deflection per pascal, $A/(2k)$ for the two-spring membrane."
    unit: "m/Pa"
    concept: transfer_function

  # --- noise (M4) -----------------------------------------------------------------------------------
  - id: nz_V
    latex: "V(t)"
    label: "V(t)"
    meaning: "The **clean** sensor signal — what we want to measure."
    unit: V
    concept: noise_types
  - id: nz_n
    latex: "n(t)"
    label: "n(t)"
    meaning: "The **random** part. Additive: in volts. Multiplicative: a relative fluctuation (no unit)."
    concept: noise_types
  - id: nz_Vmeas
    latex: "V_\\text{meas}"
    label: "V_meas"
    meaning: "What the instrument actually reads: signal and noise combined."
    unit: V
    concept: noise_types
  - id: nz_mean
    latex: "\\bar x"
    label: "x̄"
    meaning: "**Mean**: the average value, where the wiggles are centred."
    unit: V
    concept: variance_rms
  - id: nz_sigma2
    latex: "\\sigma^2"
    label: "σ²"
    meaning: "**Variance**: the average squared deviation from the mean — the noise **power**. In $\\text{V}^2$."
    unit: "V²"
    concept: variance_rms
  - id: nz_sigma
    latex: "\\sigma"
    label: "σ"
    meaning: "**Standard deviation**: the typical size of the wiggles, $\\sqrt{\\sigma^2}$. For zero-mean noise equal to the RMS."
    unit: V
    concept: variance_rms
  - id: nz_rms
    latex: "V_\\text{rms}"
    label: "V_rms"
    meaning: "**RMS** (root mean square): square, average, take the root. The 'effective' size of a fluctuating voltage."
    unit: V
    concept: variance_rms
  - id: nz_S
    latex: "S(f)"
    label: "S(f)"
    meaning: "**Power spectral density**: noise power per hertz at frequency $f$ (one-sided)."
    unit: "V²/Hz"
    concept: psd
  - id: nz_S0
    latex: "S_0"
    label: "S₀"
    meaning: "**White noise level**: the constant height of a flat PSD."
    unit: "V²/Hz"
    concept: psd
  - id: nz_S1
    latex: "S_1"
    label: "S₁"
