# Symbol dictionary: every mathematical symbol or expression a learner can click.
# meaning: plain words first, then the precise statement. Markdown + $LaTeX$.

symbols:
  # --- voltage / potential ---------------------------------------------------------
  - id: phiA
    latex: "\\varphi_A"
    label: "φ_A"
    meaning: "**Potential of node A** — how high node A sits on the 'electrical height' scale. On its own it only means something relative to a chosen reference."
    unit: V
    concept: voltage
  - id: phiB
    latex: "\\varphi_B"
    label: "φ_B"
    meaning: "**Potential of node B** — the 'electrical height' of node B, measured from the same reference."
    unit: V
    concept: voltage
  - id: VAB
    latex: "V_{AB}"
    label: "V_AB"
    meaning: "**Voltage from B to A**: the difference $V_{AB} = \\varphi_A - \\varphi_B$. This is what a voltmeter with its red lead on A and black lead on B shows."
    unit: V
    concept: voltage

  # --- Ohm's law --------------------------------------------------------------------
  - id: ohm_V
    latex: "V"
    label: "V"
    meaning: "**Voltage across the resistor** — the 'push' that drives charge through it. Here it equals the battery voltage."
    unit: V
    concept: voltage
  - id: ohm_R
    latex: "R"
    label: "R"
    meaning: "**Resistance** — how strongly the resistor opposes current. It sits in the **denominator** (bottom) of $I = V/R$: a bigger bottom number makes the result smaller."
    unit: "Ω"
    concept: resistance
  - id: ohm_I
    latex: "I"
    label: "I"
    meaning: "**Current** — how much charge flows past a point each second. In a single loop it is the same everywhere."
    unit: A
    concept: charge_current

  # --- divider ------------------------------------------------------------------------
  - id: div_Vin
    latex: "V_\\text{in}"
    label: "V_in"
    meaning: "**Supply voltage** across the whole divider (both resistors together)."
    unit: V
    concept: voltage
  - id: div_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Top resistor**, between the supply and the output node."
    unit: "Ω"
    concept: resistance
  - id: div_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Bottom resistor**, between the output node and ground. The output voltage is the voltage across this resistor — that is why $R_2$ is on top of the fraction."
    unit: "Ω"
    concept: voltage_divider
  - id: div_total
    latex: "R_1 + R_2"
    label: "R₁ + R₂"
    meaning: "**Total resistance of the path.** The current has to pass through both resistors one after the other, so their resistances add. It is the denominator: the whole."
    unit: "Ω"
    concept: series_circuit
  - id: div_Vout
    latex: "V_\\text{out}"
    label: "V_out"
    meaning: "**Output voltage**: the potential of the middle node measured from ground — the share of the supply that drops across $R_2$."
    unit: V
    concept: voltage_divider

  # --- ground -----------------------------------------------------------------------
  - id: phi_ref
    latex: "\\varphi_\\text{ref}^\\text{old}"
    label: "φ_ref"
    meaning: "**Old potential of the node that becomes the new ground.** Subtracting it from every node makes that node read 0 V."
    unit: V
    concept: ground_reference

  # --- KCL ------------------------------------------------------------------------------
  - id: kcl_Iin
    latex: "I_\\text{in}"
    label: "I_in"
    meaning: "**Current flowing into the node.**"
    unit: A
    concept: kcl
  - id: kcl_I1
    latex: "I_1"
    label: "I₁"
    meaning: "**Current leaving through branch 1.**"
    unit: A
    concept: kcl
  - id: kcl_I2
    latex: "I_2"
    label: "I₂"
    meaning: "**Current leaving through branch 2** — whatever is left over. If it comes out negative, it actually flows *into* the node."
    unit: A
    concept: kcl

  # --- strain gauge / sensor --------------------------------------------------------------
  - id: sens_p
    latex: "p"
    label: "p"
    meaning: "**Pressure** on the membrane: force per area, $p = F/A$."
    unit: Pa
    concept: strain
  - id: sens_xi
    latex: "\\xi"
    label: "ξ"
    meaning: "**Membrane factor** (Greek 'xi'): how much strain one pascal of pressure produces. It depends on the membrane's size, thickness and stiffness: $\\varepsilon = \\xi\\,p$."
    unit: "1/Pa"
    concept: strain
  - id: sens_eps
    latex: "\\varepsilon"
    label: "ε"
    meaning: "**Strain** (Greek 'epsilon'): how much the surface stretches, as a fraction of its length. $+$ = stretched, $-$ = compressed. Tiny numbers, so we write µε = $10^{-6}$."
    unit: "1"
    concept: strain
  - id: sens_G
    latex: "G"
    label: "G"
    meaning: "**Gauge factor**: how strongly the gauge's resistance reacts to strain, $\\Delta R/R = G\\,\\varepsilon$. About 2 for metal foil, of order 100 for silicon."
    unit: "1"
    concept: gauge_factor

  # --- Wheatstone bridge --------------------------------------------------------------------
  - id: br_V0
    latex: "V_0"
    label: "V₀"
    meaning: "**Bridge supply voltage** that feeds both dividers (the lecture also calls it $V_b$)."
    unit: V
    concept: wheatstone_bridge
  - id: br_R
    latex: "R"
    label: "R"
    meaning: "**Nominal resistance**: the value every arm has when nothing is strained (e.g. 350 Ω)."
    unit: "Ω"
    concept: resistance
  - id: br_dR
    latex: "\\Delta R"
    label: "ΔR"
    meaning: "**Change in resistance** caused by strain. Δ (Greek capital 'delta') means 'change in'. Usually tiny: a fraction of an ohm on a 350 Ω gauge."
    unit: "Ω"
    concept: gauge_factor
  - id: br_Rplus
    latex: "R + \\Delta R"
    label: "R + ΔR"
    meaning: "**Resistance increased** from its nominal value — a gauge that is being **stretched**. Drawn with an arrow pointing up-right ↗."
    unit: "Ω"
    concept: gauge_factor
  - id: br_Rminus
    latex: "R - \\Delta R"
    label: "R − ΔR"
    meaning: "**Resistance decreased** from its nominal value — a gauge that is being **compressed**. Drawn with an arrow pointing down-left ↙."
    unit: "Ω"
    concept: gauge_factor
  - id: br_x
    latex: "\\frac{\\Delta R}{R}"
    label: "ΔR/R"
    meaning: "**Relative change**: the change as a fraction of the original value. $\\Delta R/R = 0.001$ means 0.1 %. It has no unit."
    unit: "1"
    concept: ratios
  - id: br_R1
    latex: "R_1"
    label: "R₁"
    meaning: "**Arm $R_1$** (top left). The name of the component — its value is written next to it, e.g. $R + \\Delta R$."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R2
    latex: "R_2"
    label: "R₂"
    meaning: "**Arm $R_2$** (top right)."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R3
    latex: "R_3"
    label: "R₃"
    meaning: "**Arm $R_3$** (bottom right). $V_1$ is the voltage across it."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_R4
    latex: "R_4"
    label: "R₄"
    meaning: "**Arm $R_4$** (bottom left). $V_2$ is the voltage across it."
    unit: "Ω"
    concept: wheatstone_bridge
  - id: br_left
    latex: "R_1 + R_4"
    label: "R₁ + R₄"
    meaning: "**Total resistance of the left branch.** Its current $I_2$ passes through $R_1$ and then $R_4$, so they add. In the quarter bridge this is $2R + \\Delta R$."
    unit: "Ω"
    concept: series_circuit
  - id: br_right
    latex: "R_2 + R_3"
    label: "R₂ + R₃"
    meaning: "**Total resistance of the right branch**, carrying $I_1$. In the quarter bridge this is $2R$."
    unit: "Ω"
    concept: series_circuit
  - id: br_V1
    latex: "V_1"
    label: "V₁"
    meaning: "**Right midpoint voltage**, measured from ground (across $R_3$)."
    unit: V
    concept: voltage_divider
  - id: br_V2
    latex: "V_2"
    label: "V₂"
    meaning: "**Left midpoint voltage**, measured from ground (across $R_4$)."
    unit: V
    concept: voltage_divider
  - id: br_Vout
    latex: "V_2 - V_1"
    label: "V₂ − V₁"
    meaning: "**Bridge output**: the difference between the two midpoints — exactly what the meter between them reads. 0 V when balanced."
    unit: V
    concept: differential_signal
  - id: br_I1
    latex: "I_1"
    label: "I₁"
    meaning: "**Current in the right branch** ($R_2$ then $R_3$)."
    unit: A
    concept: charge_current
  - id: br_I2
    latex: "I_2"
    label: "I₂"
    meaning: "**Current in the left branch** ($R_1$ then $R_4$)."
    unit: A
    concept: charge_current
