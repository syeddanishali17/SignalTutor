questions:
  - id: why_bridge
    concepts: [wheatstone_bridge]
    priority: very_high
    question: "What is a Wheatstone bridge, and why do we use one to read out a strain gauge?"
    structure:
      - {label: definition, text: "Four resistors forming two voltage dividers fed by the same supply $V_0$; the output is the difference between the two midpoints, $V_2 - V_1$."}
      - {label: motivation, text: "A gauge changes by $\\Delta R/R \\approx 10^{-3}$. Measured directly, that is a tiny change on top of a large value. The bridge subtracts the large common part, so the output starts at zero."}
      - {label: mechanism, text: "Equal divider ratios → $V_2 = V_1$ (balanced). Strain changes one ratio → that midpoint moves → a small differential output."}
      - {label: key equation, text: "Balance: $R_1/R_4 = R_2/R_3$. Quarter: $V_2 - V_1 \\approx -\\tfrac14\\,\\tfrac{\\Delta R}{R}\\,V_0$. Full: $|V_\\text{out}| = \\tfrac{\\Delta R}{R}\\,V_b = G\\,\\varepsilon\\,V_b$."}
      - {label: physical meaning, text: "Output proportional to strain, zero offset, sensitivity set by the supply and by the number of active arms."}
      - {label: assumptions, text: "Ideal voltmeter (no current drawn); $\\Delta R/R \\ll 1$ for the quarter-bridge formula."}
      - {label: limitations, text: "Quarter bridge: slightly nonlinear and sees temperature as strain. The output is mV riding on $\\approx V_0/2$ common mode. A finite input resistance loads the bridge."}
      - {label: application, text: "Piezoresistive pressure sensor: pressure → membrane strain → $\\Delta R$ → bridge → $V_\\text{out}$."}
    expected_points:
      - {id: two_dividers, text: "Two voltage dividers from one supply; output = difference of the midpoints"}
      - {id: balanced_zero, text: "Balanced (equal ratios) → output 0; balance condition $R_1/R_4 = R_2/R_3$"}
      - {id: tiny_change, text: "Motivation: $\\Delta R/R$ is tiny; the bridge removes the big common part"}
      - {id: cm_level, text: "The output is a small differential signal on top of $\\approx V_0/2$ common mode"}
      - {id: formula, text: "States the quarter ($\\tfrac14$) or full-bridge formula correctly"}
      - {id: ideal_meter, text: "Assumption: the meter/amplifier draws no current"}
    followups:
      - {when_missing: balanced_zero, ask: "What is the output when the bridge is balanced, and what exactly is the balance condition?"}
      - {when_missing: cm_level, ask: "At what voltage does each output node sit? Why does that matter for the amplifier you connect?"}
      - {when_missing: ideal_meter, ask: "What happens to the bridge if the measuring instrument draws current?", hint: "Loading: the meter's current pulls the midpoints together — an input impedance below infinity unbalances the bridge."}
      - {always: true, ask: "Derive the output of a quarter bridge on the whiteboard."}
      - {always: true, ask: "Why would you prefer a full bridge?"}
    traps:
      - "Balance does not need four equal resistors — only equal ratios."
      - "Quarter vs full bridge: factor 4."
      - "When balanced, both outputs sit at $V_0/2$, not at 0 V."

  - id: derive_quarter
    concepts: [wheatstone_quarter]
    priority: very_high
    question: "Derive the output voltage of a quarter bridge."
    structure:
      - {label: definition, text: "One gauge $R_1 = R + \\Delta R$ (upper left) and three fixed $R$; output $V_2 - V_1$."}
      - {label: mechanism, text: "Ideal meter → two independent dividers. $I_1 = \\dfrac{V_0}{2R}$, $I_2 = \\dfrac{V_0}{2R + \\Delta R}$. $V_1 = I_1 R = \\dfrac{V_0}{2}$, $V_2 = I_2 R = \\dfrac{V_0}{2 + \\Delta R/R}$."}
      - {label: key equation, text: "$V_2 - V_1 = V_0\\left(\\dfrac{1}{2 + \\Delta R/R} - \\dfrac12\\right) \\approx -\\tfrac14\\,\\dfrac{\\Delta R}{R}\\,V_0$ for $\\Delta R/R \\ll 1$."}
      - {label: assumptions, text: "No current into the meter; $\\Delta R/R \\ll 1$ for the last step."}
      - {label: limitations, text: "The relative error of the approximation is $\\tfrac12\\,\\Delta R/R$; the sign depends on the gauge position and on which node is called +."}
    expected_points:
      - {id: no_current, text: "States $I = 0$ into the meter, so each branch is its own divider"}
      - {id: currents, text: "$I_1 = V_0/2R$ and $I_2 = V_0/(2R + \\Delta R)$"}
      - {id: nodes, text: "$V_1 = V_0/2$ and $V_2 = V_0/(2 + \\Delta R/R)$, measured across the lower arms"}
      - {id: exact, text: "Writes the exact difference"}
      - {id: approx, text: "Approximates to $-\\tfrac14\\,(\\Delta R/R)\\,V_0$"}
      - {id: condition, text: "States the condition $\\Delta R/R \\ll 1$"}
    followups:
      - {when_missing: condition, ask: "When is your approximation valid, and how big is its error?"}
      - {when_missing: no_current, ask: "Why may you treat the two branches separately?"}
      - {always: true, ask: "How big is the relative error of the approximation for ΔR/R = 2 %?", hint: "$\\tfrac12\\,\\Delta R/R = 1\\,\\%$."}
      - {always: true, ask: "Your drawing has the gauge in the lower-left arm. What changes?", hint: "$V_2 = I_2(R + \\Delta R)$. The sign flips, the magnitude stays (K9)."}
    traps:
      - "$V_2$ is measured from ground, i.e. across the **lower** arm."
      - "Forgetting the $\\ll$ condition when writing $\\approx$."
      - "Sign: depends on where the gauge sits and which node is called +."

  - id: full_vs_quarter
    concepts: [wheatstone_full, temperature_compensation]
    priority: high
    question: "Compare a quarter bridge with a full bridge. Which would you use for a pressure membrane, and why?"
    structure:
      - {label: definition, text: "Quarter: one active gauge. Full: four active gauges, two stretched and two compressed."}
      - {label: mechanism, text: "In the full bridge diagonally opposite arms have the same sign, so both midpoints move apart; each branch still totals $2R$."}
      - {label: key equation, text: "Quarter $\\approx \\tfrac14\\,\\tfrac{\\Delta R}{R}\\,V_0$; full $= \\tfrac{\\Delta R}{R}\\,V_b = G\\,\\varepsilon\\,V_b$."}
      - {label: physical meaning, text: "Full: 4× the sensitivity, exactly linear, temperature-compensated."}
      - {label: limitations, text: "Needs four matched gauges at places with equal and opposite strain; more wiring."}
      - {label: application, text: "Membrane pressure sensors put gauges near the rim (stretched) and near the centre (compressed)."}
    expected_points:
      - {id: factor4, text: "Full bridge gives 4× the output"}
      - {id: linear, text: "Full bridge is exactly linear (no $\\ll$ approximation)"}
      - {id: temp, text: "Full bridge cancels equal temperature drifts; quarter bridge does not"}
      - {id: arrangement, text: "Diagonally opposite gauges see the same sign of strain"}
    followups:
      - {when_missing: temp, ask: "What happens to each bridge when the membrane warms up by 10 K?"}
      - {when_missing: arrangement, ask: "Where on the bridge do the stretched and the compressed gauges go?"}
      - {always: true, ask: "Write the transfer function from strain to voltage of the full bridge."}
    traps:
      - "Temperature cancels only for resistors that drift together in matched positions."

  - id: gauge_factor_q
    concepts: [gauge_factor]
    priority: high
    question: "What is the gauge factor, and how does it enter the transfer function of a piezoresistive pressure sensor?"
    structure:
      - {label: definition, text: "$G = \\dfrac{\\Delta R/R}{\\varepsilon}$. Relative resistance change per unit strain; no unit."}
      - {label: mechanism, text: "Strain changes the geometry (longer, thinner) and, in silicon, the resistivity itself."}
      - {label: key equation, text: "$\\Delta R/R = G\\,\\varepsilon$; full bridge $V_\\text{out} = G\\,\\varepsilon\\,V_b$; $H_{\\varepsilon\\text{-}V} = G\\,V_b$; overall $H_{p\\text{-}V} = \\xi\\,G\\,V_b$."}
      - {label: physical meaning, text: "Metal foil $G \\approx 2$ (geometry); silicon of order 100 (piezoresistive effect)."}
      - {label: application, text: "Chain: pressure → membrane ($H_{p\\text{-}\\varepsilon} = \\xi$) → strain → gauge + bridge ($H_{\\varepsilon\\text{-}V}$) → voltage."}
    expected_points:
      - {id: definition, text: "$G = (\\Delta R/R)/\\varepsilon$, no unit"}
      - {id: values, text: "Typical values: ≈ 2 metal, of order 100 silicon"}
      - {id: chain, text: "Places it in the chain $p \\to \\varepsilon \\to \\Delta R/R \\to V$"}
      - {id: transfer, text: "$H_{\\varepsilon\\text{-}V} = G\\,V_b$; the stages multiply: $H = H_{p\\text{-}\\varepsilon}\\,H_{\\varepsilon\\text{-}V}$"}
    followups:
      - {when_missing: chain, ask: "Draw the transfer chain of the piezoresistive pressure sensor."}
      - {always: true, ask: "Why is silicon's gauge factor so much larger than a metal's?"}
    traps:
      - "Multiplying transfer functions of cascaded stages assumes every stage is linear."

whiteboard:
  - id: wb_quarter_derive
    concepts: [wheatstone_quarter]
    skill: derive
    prompt: "Draw a quarter bridge (supply, ground, R + ΔR, three R, V₁, V₂) and derive V₂ − V₁, first exactly, then for ΔR/R ≪ 1."
    time_limit_s: 360
    reference_figure: bridge_quarter
    reference_derivation: quarter_bridge
    checklist:
      - {id: figure, text: "Bridge drawn with $V_0$, ground, the gauge marked $R + \\Delta R$, nodes $V_1$ and $V_2$"}
      - {id: no_current, text: "Wrote $I = 0$ into the meter"}
      - {id: currents, text: "$I_1 = V_0/2R$ and $I_2 = V_0/(2R + \\Delta R)$"}
      - {id: nodes, text: "$V_1 = V_0/2$ and $V_2 = V_0/(2 + \\Delta R/R)$"}
      - {id: exact, text: "Exact difference written"}
      - {id: approx, text: "$\\approx -\\tfrac14\\,(\\Delta R/R)\\,V_0$ with the condition $\\Delta R/R \\ll 1$"}

  - id: wb_full_draw
    concepts: [wheatstone_full]
    skill: draw
    prompt: "Draw a full bridge for a pressure membrane. Mark which gauges are stretched (+ΔR) and which are compressed (−ΔR), the supply, ground, and where V_out is taken."
    time_limit_s: 240
    reference_figure: bridge_full
    checklist:
      - {id: arms, text: "Four arms labelled $R_1$ to $R_4$ with supply $V_b$ and ground"}
      - {id: signs, text: "Diagonally opposite arms carry the same sign ($R_1, R_3$: $+\\Delta R$; $R_2, R_4$: $-\\Delta R$)"}
      - {id: output, text: "Output terminals at the two midpoints, polarity labelled"}
      - {id: formula, text: "Wrote $V_\\text{out} = \\tfrac{\\Delta R}{R}\\,V_b = G\\,\\varepsilon\\,V_b$ next to it"}
