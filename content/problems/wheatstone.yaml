# Templates and solutions are Markdown + $LaTeX$. Placeholders are [[name]].
problems:
  - id: full_bridge_output
    concept: wheatstone_full
    kind: numeric
    level: 4
    template: >-
      A full bridge has gauge factor $G = [[G]]$, strain $\varepsilon = [[eps_ue]]\,\mu\varepsilon$ on every gauge
      and supply $V_b = [[Vb]]\,\text{V}$. What is the magnitude of the output $V_\text{out}$?
    params:
      G: {choices: [2.0, 2.1, 100]}
      eps_ue: {range: [100, 1000], step: 50}
      Vb: {choices: [2.5, 3.3, 5.0]}
    answer: {fn: bridge.full_output_mag, unit: V, tolerance_rel: 0.02, accept_sign: either, display_prefix: m}
    misconception_checks:
      - {scale: 0.25, misconception: quarter_vs_full}
      - {fn: bridge.full_with_raw_microstrain, misconception: microstrain_slip}
    solution: >-
      Full bridge: $|V_\text{out}| = G\,\varepsilon\,V_b = [[G]] \times ([[eps_ue]]\times10^{-6}) \times [[Vb]]\,\text{V}$.
      No $\tfrac14$. That belongs to the quarter bridge.

  - id: quarter_bridge_output
    concept: wheatstone_quarter
    kind: numeric
    level: 4
    template: >-
      A quarter bridge: three fixed resistors $R = [[R]]\,\Omega$ and one gauge $R + \Delta R$ with
      $\Delta R = [[dR]]\,\Omega$, supply $V_0 = [[V0]]\,\text{V}$. What is the magnitude of $V_2 - V_1$?
      (The small-change approximation is fine.)
    params:
      R: {choices: [120, 350, 1000]}
      dR: {choices: [0.12, 0.24, 0.35, 0.5, 1.0]}
      V0: {choices: [2.5, 5.0, 10.0]}
    answer: {fn: bridge.quarter_output_mag, unit: V, tolerance_rel: 0.02, accept_sign: either, display_prefix: m}
    misconception_checks:
      - {scale: 4, misconception: quarter_vs_full}
    solution: >-
      $|V_2 - V_1| \approx \tfrac14\,\dfrac{\Delta R}{R}\,V_0 = \tfrac14 \times \dfrac{[[dR]]}{[[R]]} \times [[V0]]\,\text{V}$.
      The exact formula differs from this by only $\tfrac12\,\Delta R/R$ (relative).

  - id: quarter_v2_direction
    concept: wheatstone_quarter
    kind: direction
    level: 2
    template: >-
      Quarter bridge with the gauge in the upper-left arm, $R_1$. The membrane stretches the gauge, so $R_1$ increases.
      The left midpoint voltage $V_2$ (measured from ground)…
    options:
      - {id: down, text: "decreases"}
      - {id: same, text: "stays at $V_0/2$"}
      - {id: up, text: "increases", misconception: divider_swapped}
    correct: down
    solution: >-
      $V_2 = V_0\,\dfrac{R_4}{R_1 + R_4}$. $R_1$ is the **top** resistor of the left divider: making it bigger takes a
      bigger share of the supply, so $V_2$ drops. (Gauge in the lower arm → $V_2$ rises: the sign depends on
      placement, see K9.)

  - id: gauge_dR
    concept: gauge_factor
    kind: numeric
    level: 4
    template: >-
      A strain gauge with $G = [[G]]$ and $R = [[R]]\,\Omega$ sees a strain of $[[eps_ue]]\,\mu\varepsilon$.
      What is $\Delta R$?
    params:
      G: {choices: [2.0, 2.1]}
      R: {choices: [120, 350, 1000]}
      eps_ue: {range: [200, 1000], step: 100}
    answer: {fn: bridge.gauge_dR, unit: ohm, tolerance_rel: 0.02, display_prefix: m}
    misconception_checks:
      - {fn: bridge.gauge_dR_raw_microstrain, misconception: microstrain_slip}
    solution: "$\\Delta R = G\\,\\varepsilon\\,R = [[G]] \\times ([[eps_ue]]\\times10^{-6}) \\times [[R]]\\,\\Omega$."

  - id: h_eps_v
    concept: wheatstone_full
    kind: numeric
    level: 4
    template: >-
      Full bridge with $G = [[G]]$ and $V_b = [[Vb]]\,\text{V}$. What is the transfer function
      $H_{\varepsilon\text{-}V} = V_\text{out}/\varepsilon$ (volts per unit strain)?
    params:
      G: {choices: [2.0, 2.1, 100]}
      Vb: {choices: [2.5, 3.3, 5.0]}
    answer: {fn: bridge.h_eps_v, unit: V, tolerance_rel: 0.02}
    misconception_checks:
      - {scale: 0.25, misconception: quarter_vs_full}
    solution: >-
      $H_{\varepsilon\text{-}V} = G\,V_b = [[G]] \times [[Vb]]\,\text{V}$ per unit strain. Multiply by $\varepsilon$ to get $V_\text{out}$.

  - id: approx_error
    concept: wheatstone_quarter
    kind: numeric
    level: 5
    template: >-
      Quarter bridge with $\Delta R/R = [[x_pct]]\,\%$. By what percentage does the approximation
      $-\tfrac14\,\tfrac{\Delta R}{R}\,V_0$ overestimate the size of the exact output? Answer with a % sign.
    params:
      x_pct: {choices: [0.2, 1, 2, 5, 10]}
    answer: {fn: bridge.approx_rel_error, unit: "1", tolerance_rel: 0.03}
    solution: >-
      $\dfrac{\text{approx}}{\text{exact}} = \dfrac{2 + \Delta R/R}{2} = 1 + \tfrac12\,\dfrac{\Delta R}{R}$, so the
      overestimate is half of $\Delta R/R$: $[[x_pct]]\,\% / 2$.

  - id: full_vs_quarter_factor
    concept: wheatstone_full
    kind: mc
    level: 2
    template: >-
      Same supply, same strain on every active gauge. How many times larger is the full-bridge output than the
      quarter-bridge output (small strain)?
    options:
      - {id: one, text: "1× (the same)", misconception: full_same_as_quarter}
      - {id: two, text: "2×", misconception: quarter_vs_full}
      - {id: four, text: "4×"}
      - {id: sixteen, text: "16×"}
    correct: four
    solution: "Quarter $\\approx \\tfrac14\\,\\tfrac{\\Delta R}{R}\\,V_0$, full $= \\tfrac{\\Delta R}{R}\\,V_0$. A factor 4."

  - id: balance_condition
    concept: wheatstone_bridge
    kind: mc
    level: 3
    template: >-
      Left divider: $R_1$ (top) over $R_4$ (bottom). Right divider: $R_2$ (top) over $R_3$ (bottom).
      When is $V_2 - V_1 = 0$?
    options:
      - {id: ratio, text: "$R_1/R_4 = R_2/R_3$"}
      - {id: equal, text: "only when $R_1 = R_2 = R_3 = R_4$", misconception: balance_needs_equal}
      - {id: sum, text: "$R_1 + R_4 = R_2 + R_3$"}
      - {id: zero, text: "only when the supply $V_0$ is 0 V"}
    correct: ratio
    solution: >-
      Balanced when both dividers give the same share: $\dfrac{R_4}{R_1+R_4} = \dfrac{R_3}{R_2+R_3}
      \Leftrightarrow \dfrac{R_1}{R_4} = \dfrac{R_2}{R_3} \Leftrightarrow R_1 R_3 = R_2 R_4$.

  - id: midpoint_balanced
    concept: common_mode
    kind: numeric
    level: 3
    template: >-
      A balanced bridge with four equal resistors is fed with $V_0 = [[V0]]\,\text{V}$. What is the voltage of
      each output node, measured from ground?
    params:
      V0: {choices: [2.5, 3.3, 5.0, 10.0]}
    answer: {fn: bridge.midpoint_balanced, unit: V, tolerance_rel: 0.01}
    misconception_checks:
      - {fn: zero, misconception: output_nodes_at_zero}
    solution: >-
      Each side is a divider of two equal resistors: $V_0/2 = [[V0]]/2\,\text{V}$. The difference is zero; the shared
      $V_0/2$ is common mode.

  - id: cm_in_bridge
    concept: common_mode
    kind: mc
    level: 2
    template: "In a 5 V bridge both output nodes sit near 2.5 V and differ by 1 mV. The shared 2.5 V is…"
    options:
      - {id: cm, text: "the common-mode signal"}
      - {id: noise, text: "noise that must be filtered away", misconception: cm_is_noise}
      - {id: diff, text: "the differential signal", misconception: diff_is_small_absolute}
      - {id: zero, text: "impossible — balanced outputs are at 0 V", misconception: output_nodes_at_zero}
    correct: cm
    solution: "Shared part = common mode ($\\approx V_0/2$). The 1 mV difference is the differential signal that carries the measurement."

  - id: temp_quarter
    concept: temperature_compensation
    kind: mc
    level: 3
    template: "Quarter bridge: only the gauge $R_1$ is on the membrane. The membrane warms up by 10 K but is not strained. The output…"
    options:
      - {id: changes, text: "changes — the warming looks like strain"}
      - {id: zero, text: "stays 0 — temperature cancels in any bridge", misconception: quarter_compensates}
    correct: changes
    solution: "Only $R_1$ drifts, so the bridge unbalances exactly as if it were strained (apparent strain $\\alpha\\,\\Delta T/G$)."

  - id: temp_full
    concept: temperature_compensation
    kind: direction
    level: 3
    template: "Full bridge: all four gauges warm up by the same 10 K (no change in strain). The output…"
    options:
      - {id: down, text: "decreases"}
      - {id: same, text: "is unchanged"}
      - {id: up, text: "increases"}
    correct: same
    solution: "Every arm is multiplied by the same $(1 + \\alpha\\,\\Delta T)$; each divider ratio is unchanged, so the output is unchanged."

  - id: loading_reading
    concept: bridge_loading
    kind: direction
    level: 3
    template: >-
      An unbalanced bridge (all arms $\approx R$) is read by a meter whose input resistance is only $10\,R$
      instead of $\infty$. Compared to the ideal reading, the meter shows…
    options:
      - {id: down, text: "a smaller value (about 9 % less)"}
      - {id: same, text: "the same value", misconception: meter_is_free}
      - {id: up, text: "a larger value"}
    correct: down
    solution: >-
      The meter's current pulls the two midpoints together:
      $V_\text{read} \approx V_\text{open}\,\dfrac{R_\text{in}}{R_\text{in} + R} = \tfrac{10}{11}\,V_\text{open}$.
