id: quarter_bridge
title: Quarter-bridge output
concept: wheatstone_quarter
figure: bridge_quarter
source: "notes (gauge placed in the upper-left arm, see K9)"
symbols: {V0: V, R: ohm, dR: ohm, I1: A, I2: A, V1: V, V2: V}
steps:
  - id: setup
    latex: "R_1 = R + \\Delta R,\\quad R_2 = R_3 = R_4 = R,\\qquad I_\\text{meter} = 0"
    changed: "Name the parts. Only $R_1$ (upper left) is the strain gauge."
    why: "An ideal voltmeter draws no current, so the two branches do not influence each other: each one is a separate voltage divider."
    law: "Circuit reading"
    assumption: "Ideal voltmeter (infinite input resistance)"
    highlight: [R1, meter]

  - id: i1
    latex: "I_1 = \\frac{V_0}{2R}"
    annotated: |-
      I_1 = \frac{\overbrace{V_0}^{\text{push: the supply}}}{\underbrace{2R}_{\text{right branch: } R_2 + R_3}}
    changed: "Current in the right branch."
    why: "$R_2$ and $R_3$ are in series between $V_0$ and ground: total $2R$. Ohm's law gives the branch current."
    law: "Series resistors + Ohm's law"
    highlight: [R2, R3, I1]
    check: {kind: define, name: I1, expr: "V0/(2*R)"}
    fade:
      prompt: "Current in the right branch ($R_2$ and $R_3$)?"
      correct: 0
      options:
        - {latex: "\\frac{V_0}{2R}", expr: "V0/(2*R)"}
        - {latex: "\\frac{V_0}{R}", expr: "V0/R"}
        - {latex: "\\frac{V_0}{2R + \\Delta R}", expr: "V0/(2*R + dR)"}
        - {latex: "2R\\,V_0", expr: "2*R*V0"}

  - id: i2
    latex: "I_2 = \\frac{V_0}{2R + \\Delta R}"
    annotated: |-
      I_2 = \frac{\overbrace{V_0}^{\text{push: the supply}}}{\underbrace{2R + \Delta R}_{\text{left branch: } R_1 + R_4 \,=\, (R+\Delta R) + R}}
    changed: "Current in the left branch: ΔR appears for the first time."
    why: "The left branch is $R_1 = R + \\Delta R$ in series with $R_4 = R$. The total is $2R + \\Delta R$."
    law: "Series resistors + Ohm's law"
    highlight: [R1, R4, I2]
    check: {kind: define, name: I2, expr: "V0/(2*R + dR)"}
    fade:
      prompt: "Current in the left branch ($R_1 = R + \\Delta R$ and $R_4$)?"
      correct: 1
      options:
        - {latex: "\\frac{V_0}{2R}", expr: "V0/(2*R)"}
        - {latex: "\\frac{V_0}{2R + \\Delta R}", expr: "V0/(2*R + dR)"}
        - {latex: "\\frac{V_0}{2R - \\Delta R}", expr: "V0/(2*R - dR)"}
        - {latex: "\\frac{V_0}{R + \\Delta R}", expr: "V0/(R + dR)"}

  - id: v1
    latex: "V_1 = I_1 R = \\frac{V_0}{2}"
    annotated: |-
      V_1 = \underbrace{I_1}_{\text{right current}} \cdot \underbrace{R}_{R_3} = \frac{V_0}{2}
    changed: "Right midpoint voltage."
    why: "$V_1$ is measured from ground, i.e. across the lower-right resistor $R_3 = R$."
    law: "Ohm's law"
    highlight: [R3, V1]
    check: {kind: define, name: V1, expr: "I1*R"}

  - id: v2
    latex: "V_2 = I_2 R = \\frac{V_0 R}{2R + \\Delta R} = \\frac{V_0}{2 + \\Delta R/R}"
    annotated: |-
      V_2 = \underbrace{I_2}_{\text{left current}} \cdot \underbrace{R}_{R_4} = \frac{V_0\,R}{2R + \Delta R} \;\overset{\div R\text{ top and bottom}}{=}\; \frac{V_0}{2 + \Delta R/R}
    changed: "Left midpoint voltage; then divide numerator and denominator by R."
    why: "$V_2$ is measured from ground, across the lower-left resistor $R_4 = R$. Dividing by $R$ makes the normalised change $\\Delta R/R$ appear."
    law: "Ohm's law, then normalising"
    highlight: [R4, V2]
    check: {kind: define, name: V2, expr: "I2*R"}
    fade:
      prompt: "Left midpoint voltage $V_2$ (measured from ground)?"
      correct: 0
      options:
        - {latex: "\\frac{V_0}{2 + \\Delta R/R}", expr: "V0/(2 + dR/R)"}
        - {latex: "\\frac{V_0 (R + \\Delta R)}{2R + \\Delta R}", expr: "V0*(R + dR)/(2*R + dR)"}
        - {latex: "\\frac{V_0}{2}", expr: "V0/2"}
        - {latex: "\\frac{V_0\\,\\Delta R}{2R + \\Delta R}", expr: "V0*dR/(2*R + dR)"}

  - id: exact
    latex: "V_2 - V_1 = V_0\\left(\\frac{1}{2 + \\Delta R/R} - \\frac12\\right) = -\\frac{V_0}{2}\\,\\frac{\\Delta R/R}{2 + \\Delta R/R}"
    changed: "Subtract the two midpoints: the exact output."
    why: "The common V0/2 cancels in the difference; what is left is caused only by ΔR."
    law: "Algebra"
    highlight: [meter, V1, V2]
    check: {kind: equals, lhs: "V2 - V1", expr: "-V0/2*(dR/R)/(2 + dR/R)"}
    fade:
      prompt: "Exact bridge output $V_2 - V_1$?"
      correct: 2
      options:
        - {latex: "-\\frac{V_0}{2}\\,\\frac{\\Delta R}{R}", expr: "-V0/2*dR/R"}
        - {latex: "V_0\\left(\\frac{1}{2+\\Delta R/R} + \\frac12\\right)", expr: "V0*(1/(2 + dR/R) + 1/2)"}
        - {latex: "-\\frac{V_0}{2}\\,\\frac{\\Delta R/R}{2 + \\Delta R/R}", expr: "-V0/2*(dR/R)/(2 + dR/R)"}
        - {latex: "\\frac{V_0}{2}\\,\\frac{\\Delta R/R}{2 + \\Delta R/R}", expr: "V0/2*(dR/R)/(2 + dR/R)"}

  - id: approx
    latex: "V_2 - V_1 \\cong -\\frac14\\,\\frac{\\Delta R}{R}\\,V_0 \\qquad \\text{for } \\frac{\\Delta R}{R} \\ll 1"
    changed: "Drop ΔR/R next to the 2 in the denominator."
    why: "For a real gauge ΔR/R ≈ 10⁻³, so 2 + ΔR/R ≈ 2. The output becomes proportional to ΔR/R. The price is a relative error of (ΔR/R)/2."
    law: "Small-change approximation (≪)"
    assumption: "ΔR/R ≪ 1"
    highlight: [meter]
    check: {kind: approx, lhs: "V2 - V1", expr: "-dR/R*V0/4", small: dR}
    fade:
      prompt: "First-order (small ΔR/R) output?"
      correct: 1
      options:
        - {latex: "-\\frac12\\,\\frac{\\Delta R}{R}\\,V_0", expr: "-dR/R*V0/2"}
        - {latex: "-\\frac14\\,\\frac{\\Delta R}{R}\\,V_0", expr: "-dR/R*V0/4"}
        - {latex: "-\\frac{\\Delta R}{R}\\,V_0", expr: "-dR/R*V0"}
        - {latex: "+\\frac14\\,\\frac{\\Delta R}{R}\\,V_0", expr: "dR/R*V0/4"}
