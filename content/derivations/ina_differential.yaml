id: ina_differential
title: Instrumentation amplifier — differential gain
concept: instrumentation_amp
figure: ina
source: "Lecture 2 notes, p. 5 (top input at 0, bottom input at V)"
symbols: {V: V, VA: V, VB: V, R1: ohm, R2: ohm, I: A, Vo1: V, Vo2: V}
steps:
  - id: setup
    latex: "V_{\\text{in},1} = 0,\\qquad V_{\\text{in},2} = V"
    changed: "As in the lecture: top input at 0 V, bottom input at $V$ — a pure difference of $V$."
    why: "Any input pair is common mode plus difference; the common part was handled separately."
    law: "Superposition"
    assumption: "Ideal op-amps, negative feedback, not saturated"
    highlight: [in1, in2]

  - id: va
    latex: "V_A = 0"
    changed: "Node A follows the top input."
    why: "Virtual short of the top op-amp."
    law: "Virtual short"
    highlight: [VA]
    check: {kind: define, name: VA, expr: "0"}

  - id: vb
    latex: "V_B = V"
    changed: "Node B follows the bottom input."
    why: "Virtual short of the bottom op-amp."
    law: "Virtual short"
    highlight: [VB]
    check: {kind: define, name: VB, expr: "V"}

  - id: current
    latex: "I = \\frac{V_B - V_A}{R_1} = \\frac{V}{R_1}"
    annotated: |-
      I = \frac{\overbrace{V_B - V_A}^{\text{voltage across } R_1}}{R_1} = \frac{V}{R_1}\qquad(\text{the same } I \text{ flows through } R_2,\ R_1,\ R_2)
    changed: "The whole input difference appears across $R_1$."
    why: "Ohm's law on $R_1$. No current can leave into the op-amp inputs, so this same $I$ also flows through both $R_2$ (KCL): $I_1 = I_2 = I_3$."
    law: "Ohm's law + KCL"
    highlight: [R1, R2a, R2b, Ipath]
    check: {kind: define, name: I, expr: "(VB - VA)/R1"}
    fade:
      prompt: "Current through $R_1$?"
      correct: 1
      options:
        - {latex: "\\dfrac{V}{R_2}", expr: "V/R2"}
        - {latex: "\\dfrac{V}{R_1}", expr: "V/R1"}
        - {latex: "\\dfrac{V}{R_1 + 2R_2}", expr: "V/(R1 + 2*R2)"}

  - id: vo2
    latex: "V_{o2} = V_B + I\\,R_2 = V\\left(1 + \\frac{R_2}{R_1}\\right)"
    changed: "Bottom output: start at $V_B$ and add the drop across the bottom $R_2$."
    why: "The current flows from the bottom output through $R_2$ into node B, so the output is higher by $I\\,R_2$."
    law: "Ohm's law"
    highlight: [R2b, o2]
    check: {kind: define, name: Vo2, expr: "VB + I*R2"}

  - id: vo1
    latex: "V_{o1} = V_A - I\\,R_2 = -\\frac{R_2}{R_1}\\,V"
    changed: "Top output: start at $V_A$ and go *down* by the drop across the top $R_2$."
    why: "The current flows from node A through the top $R_2$ into the top output, so the output is lower by $I\\,R_2$."
    law: "Ohm's law"
    highlight: [R2a, o1]
    check: {kind: define, name: Vo1, expr: "VA - I*R2"}

  - id: gain
    latex: "V_{o2} - V_{o1} = \\left(1 + \\frac{2R_2}{R_1}\\right) V"
    annotated: |-
      V_{o2} - V_{o1} = \underbrace{\left(1 + \frac{2R_2}{R_1}\right)}_{A_d:\ \text{both } R_2 \text{ count}} V
    changed: "Subtract: stage-1 differential gain. Stage 2 ($A_d = 1$) passes it to $V_\\text{out}$."
    why: "Both $R_2$ resistors add a drop $I\\,R_2$ — hence the factor 2. Only $R_1$ needs to change to set the gain."
    law: "Algebra"
    highlight: [R1, R2a, R2b, out]
    check: {kind: equals, lhs: "Vo2 - Vo1", expr: "V*(1 + 2*R2/R1)"}
    fade:
      prompt: "Stage-1 differential output $V_{o2} - V_{o1}$?"
      correct: 2
      options:
        - {latex: "\\left(1 + \\dfrac{R_2}{R_1}\\right) V", expr: "V*(1 + R2/R1)"}
        - {latex: "\\dfrac{2R_2}{R_1}\\,V", expr: "2*R2/R1*V"}
        - {latex: "\\left(1 + \\dfrac{2R_2}{R_1}\\right) V", expr: "V*(1 + 2*R2/R1)"}
