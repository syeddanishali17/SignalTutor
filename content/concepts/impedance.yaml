id: impedance
title: Input resistance / input impedance
short: "Input impedance"
code: E10
track: electrical
prerequisites: [ohms_law, voltage_divider]
status: supplemental
source_refs: ["standard", "Lecture 2 notes, p. 4"]
one_liner: "The **input impedance** of a measuring input says how much current it draws: $I = V/R_\\text{in}$. High input impedance = it barely disturbs what it measures."
plain_words: "how 'hungry' an input is for current"
explanation_md: impedance.md
misconceptions:
  - id: low_impedance_better
    text: "A low input impedance is better because more signal gets in."
    correction: "A voltage is measured best by an input that draws **no** current. A low input resistance loads the source and pulls its voltage down."
