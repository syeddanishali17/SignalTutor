id: bridge_loading
title: Loading the bridge (finite input resistance)
short: "Loading"
track: course_l02
prerequisites: [wheatstone_bridge, ohms_law]
status: verified
source_refs: ["Lecture 2 notes, p. 4 (an input impedance below infinity unbalances the Wheatstone bridge)"]
one_liner: "A meter or amplifier that draws current changes the bridge it measures; its input resistance must be $\\gg R$."
plain_words: "measuring disturbs what you measure"
explanation_md: bridge_loading.md
misconceptions:
  - id: meter_is_free
    text: "Connecting a meter or amplifier does not change the circuit."
    correction: "Every real input draws some current. The bridge derivation assumes $I = 0$ into the meter; that only holds if the input resistance is much larger than the bridge resistors."
